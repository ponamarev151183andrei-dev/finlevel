<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EPIC REALM — НАСТОЯЩАЯ RPG</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
        }
        
        #gameContainer {
            position: relative;
            width: 400px;
            height: 700px;
            background: #1a2a1a;
            border-radius: 20px;
            overflow: hidden;
            border: 3px solid #b89b7b;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 500px;
            background: #3a5a3a;
            touch-action: none;
        }
        
        .ui-panel {
            height: 200px;
            background: #2a1a0a;
            padding: 10px;
            color: #e6d5b8;
            border-top: 3px solid #b89b7b;
            overflow-y: auto;
        }
        
        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 10px;
            background: #3a2a1a;
            padding: 10px;
            border-radius: 10px;
        }
        
        .inventory {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            margin-bottom: 10px;
        }
        
        .item-slot {
            background: #3a2a1a;
            border: 2px solid #b89b7b;
            border-radius: 8px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        
        .ctrl-btn {
            background: #b89b7b;
            border: none;
            border-radius: 30px;
            padding: 10px 20px;
            color: #1a0a0a;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        
        .ctrl-btn:active {
            transform: scale(0.95);
        }
        
        .joystick-area {
            position: absolute;
            bottom: 210px;
            left: 20px;
            width: 80px;
            height: 80px;
            background: rgba(0,0,0,0.5);
            border: 3px solid #b89b7b;
            border-radius: 40px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="400" height="500"></canvas>
        
        <div class="ui-panel">
            <div class="stats">
                <div>❤️ <span id="hp">100</span>/100</div>
                <div>⚔️ <span id="atk">15</span></div>
                <div>🛡️ <span id="def">10</span></div>
                <div>📊 <span id="lvl">1</span></div>
                <div>💰 <span id="gold">0</span></div>
            </div>
            
            <div class="inventory" id="inventory">
                <div class="item-slot">⚔️</div>
                <div class="item-slot">🛡️</div>
                <div class="item-slot">⛑️</div>
                <div class="item-slot">🧪</div>
            </div>
            
            <div class="controls">
                <button class="ctrl-btn" id="attackBtn">⚔️ Атака</button>
                <button class="ctrl-btn" id="skillBtn">✨ Умение</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // ==================== ИГРОК ====================
        let player = {
            x: 200, y: 250,
            health: 100,
            maxHealth: 100,
            attack: 15,
            defense: 10,
            level: 1,
            exp: 0,
            expToNext: 100,
            gold: 50,
            weapon: { name: 'Меч', damage: 5 },
            armor: { name: 'Кожаная броня', defense: 3 },
            inventory: ['🧪 Зелье', '⚔️ Кинжал', '🛡️ Щит'],
            attackCooldown: 0
        };
        
        // ==================== ВРАГИ ====================
        let enemies = [
            {
                x: 300, y: 200,
                type: 'goblin',
                health: 50,
                maxHealth: 50,
                attack: 8,
                defense: 2,
                exp: 20,
                gold: 10,
                size: 20,
                speed: 1
            },
            {
                x: 100, y: 300,
                type: 'skeleton',
                health: 70,
                maxHealth: 70,
                attack: 12,
                defense: 3,
                exp: 30,
                gold: 15,
                size: 22,
                speed: 0.8
            }
        ];
        
        // ==================== РИСОВАНИЕ КАРТЫ ====================
        function drawMap() {
            // Небо
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(0, 0, 400, 100);
            
            // Горы
            ctx.fillStyle = '#6a5a4a';
            ctx.beginPath();
            ctx.moveTo(50, 100);
            ctx.lineTo(100, 40);
            ctx.lineTo(150, 100);
            ctx.fill();
            
            ctx.beginPath();
            ctx.moveTo(250, 100);
            ctx.lineTo(300, 30);
            ctx.lineTo(350, 100);
            ctx.fill();
            
            // Лес
            ctx.fillStyle = '#2a5a2a';
            for (let i = 0; i < 5; i++) {
                let x = i * 70 + 30;
                ctx.fillRect(x, 120, 15, 40);
                ctx.beginPath();
                ctx.arc(x + 7, 110, 15, 0, Math.PI*2);
                ctx.fill();
            }
            
            // Трава
            ctx.fillStyle = '#3a7a3a';
            ctx.fillRect(0, 150, 400, 350);
            
            // Детали травы
            ctx.fillStyle = '#2a6a2a';
            for (let i = 0; i < 30; i++) {
                let x = Math.random() * 400;
                let y = 150 + Math.random() * 350;
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(x-5, y+15);
                ctx.lineTo(x+5, y+15);
                ctx.fill();
            }
        }
        
        // ==================== РИСОВАНИЕ ПЕРСОНАЖЕЙ ====================
        function drawGoblin(x, y) {
            // Тело
            ctx.fillStyle = '#4a8';
            ctx.fillRect(x-10, y-5, 20, 25);
            
            // Голова
            ctx.fillStyle = '#6a4';
            ctx.beginPath();
            ctx.arc(x, y-15, 10, 0, Math.PI*2);
            ctx.fill();
            
            // Глаза
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(x-4, y-18, 2, 0, Math.PI*2);
            ctx.arc(x+4, y-18, 2, 0, Math.PI*2);
            ctx.fill();
            
            // Зрачки
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(x-4, y-18, 1, 0, Math.PI*2);
            ctx.arc(x+4, y-18, 1, 0, Math.PI*2);
            ctx.fill();
            
            // Уши
            ctx.fillStyle = '#4a8';
            ctx.beginPath();
            ctx.ellipse(x-8, y-20, 2, 5, -0.2, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(x+8, y-20, 2, 5, 0.2, 0, Math.PI*2);
            ctx.fill();
            
            // Оружие
            ctx.strokeStyle = '#888';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(x+10, y-5);
            ctx.lineTo(x+25, y-10);
            ctx.stroke();
        }
        
        function drawSkeleton(x, y) {
            // Тело
            ctx.fillStyle = '#ddd';
            ctx.fillRect(x-8, y-5, 16, 25);
            
            // Голова
            ctx.beginPath();
            ctx.arc(x, y-18, 8, 0, Math.PI*2);
            ctx.fill();
            
            // Глаза
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(x-3, y-20, 2, 0, Math.PI*2);
            ctx.arc(x+3, y-20, 2, 0, Math.PI*2);
            ctx.fill();
            
            // Меч
            ctx.strokeStyle = '#aaa';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(x+12, y-10);
            ctx.lineTo(x+30, y-20);
            ctx.stroke();
        }
        
        function drawPlayer() {
            // Тело
            ctx.fillStyle = '#44a';
            ctx.fillRect(player.x-12, player.y-10, 24, 30);
            
            // Голова
            ctx.fillStyle = '#e0b07a';
            ctx.beginPath();
            ctx.arc(player.x, player.y-20, 12, 0, Math.PI*2);
            ctx.fill();
            
            // Глаза
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(player.x-5, player.y-23, 2, 0, Math.PI*2);
            ctx.arc(player.x+5, player.y-23, 2, 0, Math.PI*2);
            ctx.fill();
            
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(player.x-5, player.y-23, 1, 0, Math.PI*2);
            ctx.arc(player.x+5, player.y-23, 1, 0, Math.PI*2);
            ctx.fill();
            
            // Шлем
            ctx.fillStyle = '#ccc';
            ctx.fillRect(player.x-13, player.y-32, 26, 8);
            
            // Оружие
            ctx.strokeStyle = '#aaa';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(player.x+15, player.y-10);
            ctx.lineTo(player.x+35, player.y-15);
            ctx.stroke();
            
            // Полоска здоровья
            ctx.fillStyle = '#000';
            ctx.fillRect(player.x-20, player.y-40, 40, 4);
            let hpPercent = player.health / player.maxHealth;
            ctx.fillStyle = '#ff4444';
            ctx.fillRect(player.x-20, player.y-40, 40 * hpPercent, 4);
        }
        
        // ==================== БОЙ ====================
        function attack() {
            if (player.attackCooldown > 0) return;
            player.attackCooldown = 20;
            
            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                let dx = e.x - player.x;
                let dy = e.y - player.y;
                let dist = Math.sqrt(dx*dx + dy*dy);
                
                if (dist < 50) {
                    let damage = player.attack + (player.weapon?.damage || 0) - e.defense;
                    if (damage < 1) damage = 1;
                    
                    e.health -= damage;
                    
                    if (e.health <= 0) {
                        player.gold += e.gold;
                        player.exp += e.exp;
                        enemies.splice(i, 1);
                        
                        // Повышение уровня
                        while (player.exp >= player.expToNext) {
                            player.level++;
                            player.exp -= player.expToNext;
                            player.expToNext = Math.floor(player.expToNext * 1.5);
                            player.maxHealth += 20;
                            player.health = player.maxHealth;
                            player.attack += 3;
                            player.defense += 2;
                        }
                        
                        // Добавляем нового врага
                        if (enemies.length < 3) {
                            enemies.push({
                                x: Math.random() * 350 + 25,
                                y: Math.random() * 400 + 50,
                                type: Math.random() < 0.5 ? 'goblin' : 'skeleton',
                                health: 50 + player.level * 10,
                                maxHealth: 50 + player.level * 10,
                                attack: 8 + player.level,
                                defense: 2 + Math.floor(player.level/2),
                                exp: 20 + player.level * 5,
                                gold: 10 + player.level * 2,
                                size: 20,
                                speed: 1
                            });
                        }
                    }
                }
            }
            
            updateUI();
        }
        
        // ==================== ДВИЖЕНИЕ ====================
        let keys = {};
        
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            let touch = e.touches[0];
            let rect = canvas.getBoundingClientRect();
            let x = touch.clientX - rect.left;
            let y = touch.clientY - rect.top;
            
            if (x < 100 && y > 400) keys['left'] = true;
            else if (x > 300 && y > 400) keys['right'] = true;
            else if (x > 150 && x < 250 && y > 400) keys['up'] = true;
        });
        
        canvas.addEventListener('touchend', () => {
            keys = {};
        });
        
        function movePlayer() {
            if (keys['left']) player.x -= 3;
            if (keys['right']) player.x += 3;
            if (keys['up']) player.y -= 3;
            if (keys['down']) player.y += 3;
            
            player.x = Math.max(20, Math.min(380, player.x));
            player.y = Math.max(40, Math.min(460, player.y));
        }
        
        // ==================== ОБНОВЛЕНИЕ UI ====================
        function updateUI() {
            document.getElementById('hp').textContent = player.health;
            document.getElementById('atk').textContent = player.attack + (player.weapon?.damage || 0);
            document.getElementById('def').textContent = player.defense + (player.armor?.defense || 0);
            document.getElementById('lvl').textContent = player.level;
            document.getElementById('gold').textContent = player.gold;
            
            // Инвентарь
            let slots = document.querySelectorAll('.item-slot');
            player.inventory.forEach((item, i) => {
                if (slots[i]) slots[i].textContent = item;
            });
        }
        
        // ==================== ИГРОВОЙ ЦИКЛ ====================
        function gameLoop() {
            movePlayer();
            
            if (player.attackCooldown > 0) player.attackCooldown--;
            
            // Движение врагов
            for (let e of enemies) {
                let dx = player.x - e.x;
                let dy = player.y - e.y;
                let dist = Math.sqrt(dx*dx + dy*dy);
                
                if (dist > 0) {
                    e.x += dx / dist * e.speed;
                    e.y += dy / dist * e.speed;
                }
                
                // Атака врага
                if (dist < 30 && player.attackCooldown === 0) {
                    let damage = e.attack - player.defense;
                    if (damage < 1) damage = 1;
                    player.health -= damage;
                    player.attackCooldown = 10;
                    
                    if (player.health < 0) player.health = 0;
                }
            }
            
            // Отрисовка
            drawMap();
            
            for (let e of enemies) {
                if (e.type === 'goblin') drawGoblin(e.x, e.y);
                else drawSkeleton(e.x, e.y);
                
                // Полоска здоровья врага
                ctx.fillStyle = '#000';
                ctx.fillRect(e.x-15, e.y-25, 30, 3);
                let hpPercent = e.health / e.maxHealth;
                ctx.fillStyle = '#ff4444';
                ctx.fillRect(e.x-15, e.y-25, 30 * hpPercent, 3);
            }
            
            drawPlayer();
            
            requestAnimationFrame(gameLoop);
        }
        
        document.getElementById('attackBtn').addEventListener('click', attack);
        document.getElementById('skillBtn').addEventListener('click', () => {
            // Умение - огненный шар
            for (let e of enemies) {
                e.health -= 30;
            }
        });
        
        gameLoop();
        updateUI();
    </script>
</body>
</html>
