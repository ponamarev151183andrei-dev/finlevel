<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DRAGON REALM — 3D RPG</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
        }
        
        #gameContainer {
            position: relative;
            width: 400px;
            height: 700px;
            background: linear-gradient(180deg, #0a1a2a, #1a3a5a);
            border-radius: 30px;
            overflow: hidden;
            border: 3px solid #ffaa00;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 500px;
            background: #2a4a6a;
            touch-action: none;
        }
        
        .ui-panel {
            height: 200px;
            background: linear-gradient(145deg, #2a2a3a, #1a1a2a);
            padding: 15px;
            color: #fff;
            border-top: 3px solid #ffaa00;
            overflow-y: auto;
        }
        
        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            background: rgba(255,170,0,0.2);
            padding: 12px;
            border-radius: 20px;
            border: 1px solid #ffaa00;
        }
        
        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #ffaa00;
            text-shadow: 2px 2px 0 #000;
            font-size: 14px;
        }
        
        .stat-value {
            font-size: 20px;
            font-weight: bold;
            color: #fff;
        }
        
        .inventory {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }
        
        .item-slot {
            background: linear-gradient(145deg, #3a3a4a, #2a2a3a);
            border: 2px solid #ffaa00;
            border-radius: 15px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.1s;
        }
        
        .item-slot:active {
            transform: scale(0.95);
            background: #ffaa00;
            color: #000;
        }
        
        .controls {
            display: flex;
            gap: 10px;
        }
        
        .ctrl-btn {
            flex: 1;
            background: linear-gradient(145deg, #ffaa00, #cc8800);
            border: none;
            border-radius: 30px;
            padding: 15px;
            color: #000;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 5px 0 #664400;
        }
        
        .ctrl-btn:active {
            transform: translateY(5px);
            box-shadow: none;
        }
        
        #attackBtn { background: linear-gradient(145deg, #ff4444, #aa2222); }
        #skillBtn { background: linear-gradient(145deg, #4444ff, #2222aa); }
        
        .joystick-area {
            position: absolute;
            bottom: 210px;
            left: 20px;
            width: 80px;
            height: 80px;
            background: rgba(0,0,0,0.6);
            border: 3px solid #ffaa00;
            border-radius: 50px;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 20px #ffaa00;
        }
        
        .damage-number {
            position: absolute;
            color: #ffaa00;
            font-weight: bold;
            font-size: 24px;
            text-shadow: 2px 2px 0 #000;
            pointer-events: none;
            animation: floatUp 1s forwards;
            z-index: 100;
        }
        
        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-60px) scale(1.5); opacity: 0; }
        }
        
        .level-up {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffaa00;
            font-size: 40px;
            font-weight: bold;
            text-shadow: 3px 3px 0 #000;
            animation: levelPulse 2s;
            z-index: 200;
        }
        
        @keyframes levelPulse {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.5); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="400" height="500"></canvas>
        
        <div class="ui-panel">
            <div class="stats">
                <div class="stat-item">❤️<div class="stat-value" id="hp">100</div></div>
                <div class="stat-item">⚔️<div class="stat-value" id="atk">25</div></div>
                <div class="stat-item">🛡️<div class="stat-value" id="def">15</div></div>
                <div class="stat-item">📊<div class="stat-value" id="lvl">1</div></div>
                <div class="stat-item">💰<div class="stat-value" id="gold">0</div></div>
            </div>
            
            <div class="inventory" id="inventory">
                <div class="item-slot" onclick="useItem(0)">⚔️ Меч</div>
                <div class="item-slot" onclick="useItem(1)">🛡️ Щит</div>
                <div class="item-slot" onclick="useItem(2)">⛑️ Шлем</div>
                <div class="item-slot" onclick="useItem(3)">🧪 Зелье</div>
            </div>
            
            <div class="controls">
                <button class="ctrl-btn" id="attackBtn">⚔️ АТАКА</button>
                <button class="ctrl-btn" id="skillBtn">✨ УМЕНИЕ</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // ==================== 3D ПАРАМЕТРЫ ====================
        let camera = {
            x: 0,
            y: 0,
            z: 300,
            rotation: 0
        };
        
        // ==================== ИГРОК ====================
        let player = {
            x: 0, y: 0, z: 0,
            health: 100,
            maxHealth: 100,
            attack: 25,
            defense: 15,
            level: 1,
            exp: 0,
            expToNext: 100,
            gold: 0,
            attackCooldown: 0,
            invincible: 0,
            speed: 5,
            weapon: { damage: 5, equipped: true },
            armor: { defense: 3, equipped: true },
            helmet: { defense: 2, equipped: true },
            potions: 3,
            rotation: 0,
            animation: 0
        };
        
        // ==================== 3D ОБЪЕКТЫ ====================
        let enemies = [];
        let projectiles = [];
        
        // ==================== ГЕНЕРАЦИЯ МИРА ====================
        function generateWorld() {
            // Стены замка
            for (let i = 0; i < 8; i++) {
                let angle = (i / 8) * Math.PI * 2;
                let x = Math.cos(angle) * 200;
                let z = Math.sin(angle) * 200;
                
                // Башни
                enemies.push({
                    type: 'tower',
                    x: x, y: 0, z: z,
                    width: 30,
                    height: 100,
                    depth: 30,
                    health: 200,
                    maxHealth: 200
                });
            }
            
            // Главный дракон
            enemies.push({
                type: 'dragon',
                x: 100, y: 50, z: 100,
                width: 80,
                height: 60,
                depth: 40,
                health: 500,
                maxHealth: 500,
                attack: 30,
                defense: 20,
                exp: 300,
                gold: 500,
                speed: 2,
                animation: 0,
                active: true
            });
            
            // Стражи
            for (let i = 0; i < 5; i++) {
                let angle = Math.random() * Math.PI * 2;
                let dist = 150 + Math.random() * 100;
                enemies.push({
                    type: 'knight',
                    x: Math.cos(angle) * dist,
                    y: 0,
                    z: Math.sin(angle) * dist,
                    width: 25,
                    height: 50,
                    depth: 20,
                    health: 100,
                    maxHealth: 100,
                    attack: 15,
                    defense: 10,
                    exp: 50,
                    gold: 30,
                    speed: 3,
                    animation: 0
                });
            }
        }
        
        generateWorld();
        
        // ==================== 3D ПРОЕКЦИЯ ====================
        function project3D(x, y, z) {
            let scale = 300 / (z + 300);
            let screenX = 200 + (x - player.x) * scale;
            let screenY = 250 - (y - player.y) * scale;
            return { x: screenX, y: screenY, scale: scale };
        }
        
        // ==================== РИСОВАНИЕ 3D МИРА ====================
        function draw3D() {
            // Пол
            for (let i = -5; i <= 5; i++) {
                for (let j = -5; j <= 5; j++) {
                    let worldX = i * 100;
                    let worldZ = j * 100;
                    let pos = project3D(worldX, 0, worldZ);
                    
                    if (pos.scale > 0) {
                        let size = 100 * pos.scale;
                        ctx.fillStyle = '#3a5a3a';
                        ctx.fillRect(pos.x - size/2, pos.y - size/2, size, size/4);
                        
                        // Текстура
                        ctx.strokeStyle = '#2a4a2a';
                        ctx.lineWidth = 2;
                        ctx.strokeRect(pos.x - size/2, pos.y - size/2, size, size/4);
                    }
                }
            }
            
            // Враги
            enemies = enemies.filter(e => e.health > 0);
            
            for (let e of enemies) {
                e.animation += 0.05;
                let pos = project3D(e.x, e.y, e.z);
                
                if (pos.scale > 0) {
                    let size = e.width * pos.scale;
                    let height = e.height * pos.scale;
                    
                    // Тень
                    ctx.fillStyle = 'rgba(0,0,0,' + pos.scale * 0.3 + ')';
                    ctx.beginPath();
                    ctx.ellipse(pos.x, pos.y + height/2, size/2, size/4, 0, 0, Math.PI*2);
                    ctx.fill();
                    
                    if (e.type === 'dragon') {
                        // Тело дракона
                        ctx.fillStyle = '#c44';
                        ctx.beginPath();
                        ctx.ellipse(pos.x, pos.y - height/2, size/2, height/2, 0, 0, Math.PI*2);
                        ctx.fill();
                        
                        // Голова
                        ctx.fillStyle = '#a44';
                        ctx.beginPath();
                        ctx.ellipse(pos.x + size/2, pos.y - height, size/3, size/4, 0, 0, Math.PI*2);
                        ctx.fill();
                        
                        // Глаза
                        ctx.fillStyle = '#ff0';
                        ctx.beginPath();
                        ctx.arc(pos.x + size/1.5, pos.y - height - 5, size/8, 0, Math.PI*2);
                        ctx.fill();
                        
                        ctx.fillStyle = '#000';
                        ctx.beginPath();
                        ctx.arc(pos.x + size/1.5, pos.y - height - 5, size/16, 0, Math.PI*2);
                        ctx.fill();
                        
                        // Крылья
                        ctx.fillStyle = '#a44';
                        let wingAngle = Math.sin(e.animation) * 0.3;
                        
                        ctx.save();
                        ctx.translate(pos.x - size/3, pos.y - height/2);
                        ctx.rotate(wingAngle);
                        ctx.fillRect(-size/2, -height/4, size, height/2);
                        ctx.restore();
                        
                        ctx.save();
                        ctx.translate(pos.x + size/3, pos.y - height/2);
                        ctx.rotate(-wingAngle);
                        ctx.fillRect(0, -height/4, size, height/2);
                        ctx.restore();
                        
                        // Полоска здоровья босса
                        ctx.fillStyle = '#000';
                        ctx.fillRect(pos.x - 50, pos.y - height - 30, 100, 10);
                        let hpPercent = e.health / e.maxHealth;
                        ctx.fillStyle = '#f44';
                        ctx.fillRect(pos.x - 50, pos.y - height - 30, 100 * hpPercent, 10);
                        
                    } else if (e.type === 'knight') {
                        // Рыцарь
                        ctx.fillStyle = '#88a';
                        ctx.fillRect(pos.x - size/2, pos.y - height, size, height);
                        
                        // Голова
                        ctx.fillStyle = '#e0b07a';
                        ctx.beginPath();
                        ctx.arc(pos.x, pos.y - height - size/2, size/3, 0, Math.PI*2);
                        ctx.fill();
                        
                        // Шлем
                        ctx.fillStyle = '#aac';
                        ctx.fillRect(pos.x - size/3, pos.y - height - size, size*0.7, size/3);
                        
                        // Меч
                        ctx.strokeStyle = '#aaa';
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.moveTo(pos.x + size/2, pos.y - height/2);
                        ctx.lineTo(pos.x + size, pos.y - height);
                        ctx.stroke();
                    }
                }
            }
            
            // Игрок
            player.animation += 0.1;
            let playerPos = project3D(0, 0, 0);
            
            // Тень игрока
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.beginPath();
            ctx.ellipse(playerPos.x, playerPos.y + 20, 20, 5, 0, 0, Math.PI*2);
            ctx.fill();
            
            // Тело
            ctx.fillStyle = '#44a';
            ctx.fillRect(playerPos.x - 15, playerPos.y - 40, 30, 40);
            
            // Голова
            ctx.fillStyle = '#e0b07a';
            ctx.beginPath();
            ctx.arc(playerPos.x, playerPos.y - 55, 12, 0, Math.PI*2);
            ctx.fill();
            
            // Шлем
            ctx.fillStyle = '#66c';
            ctx.fillRect(playerPos.x - 10, playerPos.y - 65, 20, 10);
            
            // Глаза
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(playerPos.x - 5, playerPos.y - 58, 2, 0, Math.PI*2);
            ctx.arc(playerPos.x + 5, playerPos.y - 58, 2, 0, Math.PI*2);
            ctx.fill();
            
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(playerPos.x - 5, playerPos.y - 58, 1, 0, Math.PI*2);
            ctx.arc(playerPos.x + 5, playerPos.y - 58, 1, 0, Math.PI*2);
            ctx.fill();
            
            // Оружие
            let weaponSway = Math.sin(player.animation) * 5;
            ctx.strokeStyle = '#aaa';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(playerPos.x + 15, playerPos.y - 40);
            ctx.lineTo(playerPos.x + 35 + weaponSway, playerPos.y - 50 - weaponSway);
            ctx.stroke();
            
            // Полоска здоровья
            ctx.fillStyle = '#000';
            ctx.fillRect(playerPos.x - 25, playerPos.y - 80, 50, 5);
            let hpPercent = player.health / player.maxHealth;
            ctx.fillStyle = '#4f4';
            ctx.fillRect(playerPos.x - 25, playerPos.y - 80, 50 * hpPercent, 5);
        }
        
        // ==================== АТАКА ====================
        function attack() {
            if (player.attackCooldown > 0) return;
            player.attackCooldown = 20;
            
            let totalDamage = player.attack + (player.weapon.equipped ? 5 : 0);
            
            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                let dx = e.x - 0;
                let dy = e.y - 0;
                let dz = e.z - 0;
                let dist = Math.sqrt(dx*dx + dz*dz);
                
                if (dist < 100) {
                    let damage = totalDamage - (e.defense || 5);
                    if (damage < 1) damage = 1;
                    
                    e.health -= damage;
                    
                    // Показываем урон
                    let pos = project3D(e.x, e.y, e.z);
                    showDamage(pos.x, pos.y, damage);
                    
                    if (e.health <= 0) {
                        player.exp += e.exp || 50;
                        player.gold += e.gold || 30;
                        
                        // Проверка уровня
                        while (player.exp >= player.expToNext) {
                            player.level++;
                            player.exp -= player.expToNext;
                            player.expToNext = Math.floor(player.expToNext * 1.5);
                            player.maxHealth += 20;
                            player.health = player.maxHealth;
                            player.attack += 5;
                            player.defense += 3;
                            
                            showLevelUp();
                        }
                    }
                }
            }
        }
        
        function showDamage(x, y, damage) {
            let div = document.createElement('div');
            div.className = 'damage-number';
            div.style.left = x + 'px';
            div.style.top = y + 'px';
            div.textContent = '-' + damage;
            document.getElementById('gameContainer').appendChild(div);
            setTimeout(() => div.remove(), 1000);
        }
        
        function showLevelUp() {
            let div = document.createElement('div');
            div.className = 'level-up';
            div.textContent = 'LEVEL UP!';
            document.getElementById('gameContainer').appendChild(div);
            setTimeout(() => div.remove(), 2000);
        }
        
        // ==================== УПРАВЛЕНИЕ ====================
        let keys = {};
        
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            let touch = e.touches[0];
            let rect = canvas.getBoundingClientRect();
            let x = touch.clientX - rect.left;
            
            if (x < 200) {
                keys['left'] = true;
            } else {
                keys['right'] = true;
            }
        });
        
        canvas.addEventListener('touchend', () => {
            keys = {};
        });
        
        function movePlayer() {
            if (keys['left']) {
                player.rotation -= 0.05;
            }
            if (keys['right']) {
                player.rotation += 0.05;
            }
            
            // Движение вперёд всегда
            player.x += Math.sin(player.rotation) * player.speed;
            player.z += Math.cos(player.rotation) * player.speed;
        }
        
        // ==================== ОБНОВЛЕНИЕ UI ====================
        function updateUI() {
            document.getElementById('hp').textContent = Math.floor(player.health);
            document.getElementById('atk').textContent = player.attack + (player.weapon.equipped ? 5 : 0);
            document.getElementById('def').textContent = player.defense + (player.armor.equipped ? 3 : 0);
            document.getElementById('lvl').textContent = player.level;
            document.getElementById('gold').textContent = player.gold;
        }
        
        function useItem(index) {
            if (index === 3 && player.potions > 0) {
                player.health = Math.min(player.maxHealth, player.health + 50);
                player.potions--;
            } else if (index === 0) {
                player.weapon.equipped = !player.weapon.equipped;
            } else if (index === 1) {
                player.armor.equipped = !player.armor.equipped;
            }
            
            let slots = document.querySelectorAll('.item-slot');
            slots[3].innerHTML = `🧪 Зелье x${player.potions}`;
        }
        
        // ==================== ИГРОВОЙ ЦИКЛ ====================
        function gameLoop() {
            movePlayer();
            
            if (player.attackCooldown > 0) player.attackCooldown--;
            if (player.invincible > 0) player.invincible--;
            
            // Движение врагов к игроку
            for (let e of enemies) {
                if (e.type !== 'tower') {
                    let dx = 0 - e.x;
                    let dz = 0 - e.z;
                    let dist = Math.sqrt(dx*dx + dz*dz);
                    
                    if (dist > 0) {
                        e.x += dx / dist * (e.speed || 1);
                        e.z += dz / dist * (e.speed || 1);
                    }
                }
            }
            
            draw3D();
            updateUI();
            
            requestAnimationFrame(gameLoop);
        }
        
        document.getElementById('attackBtn').addEventListener('click', attack);
        document.getElementById('skillBtn').addEventListener('click', () => {
            // Огненный шар
            for (let e of enemies) {
                e.health -= 100;
            }
        });
        
        gameLoop();
    </script>
</body>
</html>
