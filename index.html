<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Shadow Quest — эпическая RPG</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&display=swap');
        
        body {
            background: #0a0508;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Cinzel', serif;
            position: fixed;
            width: 100%;
            height: 100%;
            overflow: hidden;
            color: #e0c9a5;
        }
        
        #gameContainer {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 400px;
            margin: 0 auto;
            background: #1a1512;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            border: 2px solid #b89b7b;
        }
        
        /* Стартовый экран */
        #startScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(145deg, #1e1916, #0f0b08);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
            text-align: center;
        }
        
        .game-title {
            font-size: 48px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 8px;
            color: #e6d5b8;
            text-shadow: 0 0 20px #b89b7b, 0 0 40px #8b6b4b;
            margin-bottom: 20px;
            animation: titlePulse 3s infinite;
        }
        
        @keyframes titlePulse {
            0%, 100% { text-shadow: 0 0 20px #b89b7b, 0 0 40px #8b6b4b; }
            50% { text-shadow: 0 0 30px #e6d5b8, 0 0 60px #b89b7b; }
        }
        
        .hero-selection {
            width: 100%;
            margin: 30px 0;
        }
        
        .hero-option {
            background: rgba(184, 155, 123, 0.2);
            border: 2px solid #b89b7b;
            border-radius: 20px;
            padding: 15px;
            margin: 15px 0;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: all 0.3s;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }
        
        .hero-option:hover {
            background: rgba(184, 155, 123, 0.4);
            transform: scale(1.02);
            box-shadow: 0 0 30px #b89b7b;
        }
        
        .hero-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(145deg, #4a3f35, #2a1f1a);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            border: 2px solid #b89b7b;
        }
        
        .hero-info {
            flex: 1;
            text-align: left;
        }
        
        .hero-name {
            font-size: 20px;
            font-weight: 700;
            color: #e6d5b8;
            margin-bottom: 5px;
        }
        
        .hero-desc {
            font-size: 12px;
            color: #a0896b;
        }
        
        .start-btn {
            background: linear-gradient(145deg, #b89b7b, #8b6b4b);
            border: none;
            border-radius: 40px;
            padding: 20px 50px;
            font-size: 24px;
            font-weight: 700;
            color: #1e1916;
            text-transform: uppercase;
            letter-spacing: 4px;
            cursor: pointer;
            box-shadow: 0 10px 0 #5a4a3a;
            transition: all 0.1s;
            margin-top: 30px;
            font-family: 'Cinzel', serif;
            width: 100%;
        }
        
        .start-btn:active {
            transform: translateY(5px);
            box-shadow: 0 5px 0 #5a4a3a;
        }
        
        /* Игровой экран */
        #gameScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            background: #0a0f1e;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #1a2a1a;
            touch-action: none;
        }
        
        .ui-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            pointer-events: none;
        }
        
        .stats-panel {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            border: 2px solid #b89b7b;
            border-radius: 30px;
            padding: 12px;
            display: flex;
            justify-content: space-around;
            color: #e6d5b8;
            font-size: 16px;
            text-shadow: 2px 2px 0 #000;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        
        .stat-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .joystick-area {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 100px;
            height: 100px;
            background: rgba(0,0,0,0.5);
            border: 2px solid #b89b7b;
            border-radius: 60px;
            backdrop-filter: blur(5px);
            touch-action: none;
            pointer-events: auto;
        }
        
        .joystick-handle {
            width: 40px;
            height: 40px;
            background: #b89b7b;
            border-radius: 30px;
            position: absolute;
            top: 30px;
            left: 30px;
            box-shadow: 0 0 20px #e6d5b8;
            pointer-events: none;
        }
        
        .attack-btn {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 80px;
            height: 80px;
            background: linear-gradient(145deg, #c44, #a22);
            border: 3px solid #e6d5b8;
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: white;
            text-shadow: 2px 2px 0 #000;
            box-shadow: 0 5px 0 #622;
            cursor: pointer;
            pointer-events: auto;
            transition: all 0.05s;
            touch-action: none;
        }
        
        .attack-btn:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 #622;
        }
        
        .skill-btn {
            position: absolute;
            bottom: 30px;
            right: 120px;
            width: 60px;
            height: 60px;
            background: linear-gradient(145deg, #46a, #228);
            border: 2px solid #e6d5b8;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            text-shadow: 2px 2px 0 #000;
            box-shadow: 0 4px 0 #224;
            cursor: pointer;
            pointer-events: auto;
            touch-action: none;
        }
        
        .skill-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #224;
        }
        
        .pause-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            background: rgba(0,0,0,0.7);
            border: 2px solid #b89b7b;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #e6d5b8;
            cursor: pointer;
            pointer-events: auto;
            z-index: 50;
        }
        
        .inventory-panel {
            position: absolute;
            bottom: 120px;
            left: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            border: 2px solid #b89b7b;
            border-radius: 20px;
            padding: 10px;
            display: flex;
            gap: 5px;
            pointer-events: auto;
            transform: translateY(200%);
            transition: transform 0.3s;
        }
        
        .inventory-panel.show {
            transform: translateY(0);
        }
        
        .inv-slot {
            flex: 1;
            aspect-ratio: 1;
            background: rgba(184, 155, 123, 0.2);
            border: 1px solid #b89b7b;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        
        .damage-number {
            position: absolute;
            color: #ff6b6b;
            font-weight: bold;
            font-size: 20px;
            text-shadow: 2px 2px 0 #000;
            pointer-events: none;
            animation: floatUp 1s forwards;
        }
        
        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-50px); opacity: 0; }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <!-- Стартовый экран -->
        <div id="startScreen">
            <div class="game-title">SHADOW QUEST</div>
            <div style="color: #b89b7b; margin-bottom: 20px;">ВЫБЕРИ ГЕРОЯ</div>
            
            <div class="hero-selection">
                <div class="hero-option" onclick="selectHero('warrior')">
                    <div class="hero-icon">⚔️</div>
                    <div class="hero-info">
                        <div class="hero-name">ВОИН</div>
                        <div class="hero-desc">Сила и выносливость</div>
                    </div>
                </div>
                
                <div class="hero-option" onclick="selectHero('rogue')">
                    <div class="hero-icon">🗡️</div>
                    <div class="hero-info">
                        <div class="hero-name">РАЗБОЙНИК</div>
                        <div class="hero-desc">Скорость и криты</div>
                    </div>
                </div>
                
                <div class="hero-option" onclick="selectHero('mage')">
                    <div class="hero-icon">🔮</div>
                    <div class="hero-info">
                        <div class="hero-name">МАГ</div>
                        <div class="hero-desc">Магия и интеллект</div>
                    </div>
                </div>
            </div>
            
            <button class="start-btn" onclick="startGame()">НАЧАТЬ</button>
        </div>
        
        <!-- Игровой экран -->
        <div id="gameScreen">
            <canvas id="gameCanvas" width="800" height="800"></canvas>
            
            <div class="ui-overlay">
                <div class="stats-panel">
                    <div class="stat-item">❤️ <span id="healthVal">100</span></div>
                    <div class="stat-item">⚔️ <span id="powerVal">15</span></div>
                    <div class="stat-item">🛡️ <span id="defenseVal">8</span></div>
                    <div class="stat-item">📊 <span id="levelVal">1</span></div>
                    <div class="stat-item">💰 <span id="goldVal">0</span></div>
                </div>
            </div>
            
            <div class="joystick-area" id="joystick">
                <div class="joystick-handle" id="joystickHandle"></div>
            </div>
            
            <button class="attack-btn" id="attackBtn">⚔️</button>
            <button class="skill-btn" id="skillBtn">✨</button>
            <button class="pause-btn" id="pauseBtn">⏸️</button>
            
            <div class="inventory-panel" id="inventoryPanel">
                <div class="inv-slot">⚔️</div>
                <div class="inv-slot">🛡️</div>
                <div class="inv-slot">🧪</div>
                <div class="inv-slot">📿</div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let selectedHero = 'warrior';
        let gameStarted = false;
        
        // ==================== КЛАССЫ ПЕРСОНАЖЕЙ ====================
        const heroes = {
            warrior: {
                name: 'ВОИН',
                health: 150,
                power: 20,
                defense: 15,
                speed: 2,
                color: '#c44',
                icon: '⚔️'
            },
            rogue: {
                name: 'РАЗБОЙНИК',
                health: 100,
                power: 25,
                defense: 8,
                speed: 3,
                color: '#4a4',
                icon: '🗡️'
            },
            mage: {
                name: 'МАГ',
                health: 80,
                power: 30,
                defense: 5,
                speed: 2.5,
                color: '#44a',
                icon: '🔮'
            }
        };
        
        // ==================== ИГРОК ====================
        let player = {
            x: 400,
            y: 400,
            size: 18,
            health: 100,
            maxHealth: 100,
            power: 15,
            defense: 8,
            level: 1,
            exp: 0,
            expToNext: 100,
            gold: 0,
            attackCooldown: 0,
            attackCooldownMax: 20,
            invincible: 0,
            speed: 2.5,
            color: '#4af',
            animation: 0,
            direction: 'down'
        };
        
        // ==================== ВРАГИ С УНИКАЛЬНЫМ ДИЗАЙНОМ ====================
        let enemies = [
            { 
                x: 200, y: 200, size: 16, 
                health: 40, maxHealth: 40, power: 6, defense: 2, speed: 1.2,
                type: 'goblin', color: '#4a4', pattern: 'bandit',
                expValue: 20, goldValue: 10,
                animation: 0
            },
            { 
                x: 600, y: 300, size: 24, 
                health: 80, maxHealth: 80, power: 12, defense: 5, speed: 0.6,
                type: 'ogre', color: '#c44', pattern: 'brute',
                expValue: 50, goldValue: 30,
                animation: 0
            },
            { 
                x: 300, y: 600, size: 14, 
                health: 30, maxHealth: 30, power: 8, defense: 1, speed: 1.8,
                type: 'imp', color: '#f90', pattern: 'shadow',
                expValue: 15, goldValue: 8,
                animation: 0
            }
        ];
        
        // ==================== ПРЕДМЕТЫ С ЭФФЕКТАМИ ====================
        let items = [
            { x: 500, y: 500, size: 8, type: 'gold', value: 5, glow: 0 },
            { x: 350, y: 350, size: 10, type: 'potion', value: 10, glow: 0 }
        ];
        
        // ==================== ДЖОЙСТИК ====================
        let joystick = {
            active: false,
            startX: 0,
            startY: 0,
            currentX: 0,
            currentY: 0,
            handle: document.getElementById('joystickHandle')
        };
        
        const joystickArea = document.getElementById('joystick');
        const attackBtn = document.getElementById('attackBtn');
        const skillBtn = document.getElementById('skillBtn');
        
        // ==================== ДЖОЙСТИК УПРАВЛЕНИЕ ====================
        joystickArea.addEventListener('touchstart', (e) => {
            e.preventDefault();
            let touch = e.touches[0];
            let rect = joystickArea.getBoundingClientRect();
            joystick.active = true;
            joystick.startX = rect.left + rect.width/2;
            joystick.startY = rect.top + rect.height/2;
            updateJoystick(touch.clientX, touch.clientY);
        });
        
        joystickArea.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!joystick.active) return;
            let touch = e.touches[0];
            updateJoystick(touch.clientX, touch.clientY);
        });
        
        joystickArea.addEventListener('touchend', (e) => {
            e.preventDefault();
            joystick.active = false;
            joystick.handle.style.transform = 'translate(30px, 30px)';
        });
        
        function updateJoystick(touchX, touchY) {
            let dx = touchX - joystick.startX;
            let dy = touchY - joystick.startY;
            let distance = Math.min(30, Math.sqrt(dx*dx + dy*dy));
            let angle = Math.atan2(dy, dx);
            
            let moveX = Math.cos(angle) * distance;
            let moveY = Math.sin(angle) * distance;
            
            joystick.handle.style.transform = `translate(${30 + moveX}px, ${30 + moveY}px)`;
            
            // Движение игрока
            player.x += Math.cos(angle) * player.speed * (distance/30);
            player.y += Math.sin(angle) * player.speed * (distance/30);
            
            // Границы
            player.x = Math.max(player.size, Math.min(800 - player.size, player.x));
            player.y = Math.max(player.size, Math.min(800 - player.size, player.y));
            
            // Анимация направления
            if (Math.abs(dx) > Math.abs(dy)) {
                player.direction = dx > 0 ? 'right' : 'left';
            } else {
                player.direction = dy > 0 ? 'down' : 'up';
            }
        }
        
        // ==================== АТАКА ====================
        function attack() {
            if (player.attackCooldown > 0) return;
            player.attackCooldown = player.attackCooldownMax;
            
            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                let dx = e.x - player.x;
                let dy = e.y - player.y;
                let dist = Math.sqrt(dx*dx + dy*dy);
                
                if (dist < 60) {
                    let damage = player.power - e.defense;
                    if (damage < 1) damage = 1;
                    
                    e.health -= damage;
                    showDamage(e.x, e.y, damage);
                    
                    if (e.health <= 0) {
                        player.gold += e.goldValue;
                        player.exp += e.expValue;
                        enemies.splice(i, 1);
                        showFloatingText(e.x, e.y, `+${e.goldValue}💰`, '#ffd700');
                        
                        if (player.exp >= player.expToNext) {
                            player.level++;
                            player.exp -= player.expToNext;
                            player.expToNext = Math.floor(player.expToNext * 1.5);
                            player.maxHealth += 20;
                            player.health = player.maxHealth;
                            player.power += 3;
                            player.defense += 2;
                            showFloatingText(player.x, player.y-50, 'LEVEL UP!', '#e6d5b8');
                        }
                    }
                }
            }
        }
        
        // ==================== ВИЗУАЛЬНЫЕ ЭФФЕКТЫ ====================
        function showDamage(x, y, amount) {
            let div = document.createElement('div');
            div.className = 'damage-number';
            div.style.left = x/800*100 + '%';
            div.style.top = y/800*100 + '%';
            div.textContent = '-' + amount;
            document.getElementById('gameScreen').appendChild(div);
            setTimeout(() => div.remove(), 1000);
        }
        
        function showFloatingText(x, y, text, color) {
            let div = document.createElement('div');
            div.className = 'damage-number';
            div.style.left = x/800*100 + '%';
            div.style.top = y/800*100 + '%';
            div.style.color = color;
            div.textContent = text;
            document.getElementById('gameScreen').appendChild(div);
            setTimeout(() => div.remove(), 1000);
        }
        
        // ==================== ОТРИСОВКА ====================
        function draw() {
            ctx.clearRect(0, 0, 800, 800);
            
            // Динамический фон
            let gradient = ctx.createRadialGradient(400, 400, 0, 400, 400, 800);
            gradient.addColorStop(0, '#2a4a2a');
            gradient.addColorStop(1, '#1a2a1a');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 800, 800);
            
            // Рисуем траву/текстуру
            ctx.fillStyle = 'rgba(255,255,255,0.03)';
            for (let i = 0; i < 50; i++) {
                ctx.beginPath();
                ctx.arc(100 + i*15, 100 + i*10, 5, 0, Math.PI*2);
                ctx.fill();
            }
            
            // Предметы с эффектом свечения
            for (let item of items) {
                item.glow = (item.glow + 0.05) % (Math.PI*2);
                let glowSize = Math.sin(item.glow) * 3;
                
                ctx.shadowColor = item.type === 'gold' ? '#ffd700' : '#ff6b6b';
                ctx.shadowBlur = 15 + glowSize;
                
                ctx.fillStyle = item.type === 'gold' ? '#ffd700' : '#ff6b6b';
                ctx.beginPath();
                ctx.arc(item.x, item.y, item.size + glowSize/2, 0, Math.PI*2);
                ctx.fill();
                
                ctx.shadowBlur = 0;
            }
            
            // Враги с уникальным дизайном
            for (let e of enemies) {
                e.animation = (e.animation + 0.1) % (Math.PI*2);
                let bobY = Math.sin(e.animation) * 2;
                
                // Тень
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.beginPath();
                ctx.ellipse(e.x, e.y + e.size/2, e.size*0.8, e.size*0.3, 0, 0, Math.PI*2);
                ctx.fill();
                
                // Тело
                ctx.fillStyle = e.color;
                ctx.shadowColor = e.color;
                ctx.shadowBlur = 20;
                ctx.beginPath();
                ctx.arc(e.x, e.y + bobY, e.size, 0, Math.PI*2);
                ctx.fill();
                
                // Глаза
                ctx.fillStyle = '#fff';
                ctx.shadowBlur = 5;
                ctx.beginPath();
                ctx.arc(e.x - 4, e.y - 4 + bobY, 3, 0, Math.PI*2);
                ctx.arc(e.x + 4, e.y - 4 + bobY, 3, 0, Math.PI*2);
                ctx.fill();
                
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(e.x - 4, e.y - 4 + bobY, 1.5, 0, Math.PI*2);
                ctx.arc(e.x + 4, e.y - 4 + bobY, 1.5, 0, Math.PI*2);
                ctx.fill();
                
                // Полоска здоровья
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#000';
                ctx.fillRect(e.x-15, e.y-25 + bobY, 30, 4);
                let hpPercent = e.health / e.maxHealth;
                ctx.fillStyle = '#ff4444';
                ctx.fillRect(e.x-15, e.y-25 + bobY, 30 * hpPercent, 4);
            }
            
            // Игрок с анимацией
            player.animation = (player.animation + 0.2) % (Math.PI*2);
            let bobY = Math.sin(player.animation) * 2;
            
            // Тень игрока
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.ellipse(player.x, player.y + player.size/2, player.size*0.8, player.size*0.3, 0, 0, Math.PI*2);
            ctx.fill();
            
            // Тело игрока
            ctx.fillStyle = player.color;
            ctx.shadowColor = player.invincible > 0 ? '#ffff00' : player.color;
            ctx.shadowBlur = player.invincible > 0 ? 40 : 20;
            ctx.beginPath();
            ctx.arc(player.x, player.y + bobY, player.size, 0, Math.PI*2);
            ctx.fill();
            
            // Глаза игрока
            ctx.fillStyle = '#fff';
            ctx.shadowBlur = 5;
            ctx.beginPath();
            ctx.arc(player.x - 5, player.y - 5 + bobY, 4, 0, Math.PI*2);
            ctx.arc(player.x + 5, player.y - 5 + bobY, 4, 0, Math.PI*2);
            ctx.fill();
            
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(player.x - 5, player.y - 5 + bobY, 2, 0, Math.PI*2);
            ctx.arc(player.x + 5, player.y - 5 + bobY, 2, 0, Math.PI*2);
            ctx.fill();
            
            // Оружие в зависимости от направления
            ctx.strokeStyle = '#aaa';
            ctx.lineWidth = 4;
            ctx.beginPath();
            switch(player.direction) {
                case 'right':
                    ctx.moveTo(player.x + 10, player.y + bobY - 5);
                    ctx.lineTo(player.x + 25, player.y + bobY - 10);
                    break;
                case 'left':
                    ctx.moveTo(player.x - 10, player.y + bobY - 5);
                    ctx.lineTo(player.x - 25, player.y + bobY - 10);
                    break;
                case 'up':
                    ctx.moveTo(player.x + 5, player.y + bobY - 15);
                    ctx.lineTo(player.x + 15, player.y + bobY - 30);
                    break;
                case 'down':
                    ctx.moveTo(player.x + 5, player.y + bobY + 5);
                    ctx.lineTo(player.x + 15, player.y + bobY + 20);
                    break;
            }
            ctx.stroke();
            
            // Полоска здоровья игрока
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#000';
            ctx.fillRect(player.x-20, player.y-35 + bobY, 40, 5);
            let hpPercent = player.health / player.maxHealth;
            ctx.fillStyle = '#44ff44';
            ctx.fillRect(player.x-20, player.y-35 + bobY, 40 * hpPercent, 5);
        }
        
        // ==================== ОБНОВЛЕНИЕ ====================
        function update() {
            if (!gameStarted) return;
            
            // Движение врагов
            for (let e of enemies) {
                let dx = player.x - e.x;
                let dy = player.y - e.y;
                let dist = Math.sqrt(dx*dx + dy*dy);
                
                if (dist > 0) {
                    e.x += dx / dist * e.speed;
                    e.y += dy / dist * e.speed;
                    e.x = Math.max(e.size, Math.min(800 - e.size, e.x));
                    e.y = Math.max(e.size, Math.min(800 - e.size, e.y));
                }
            }
            
            // Сбор предметов
            for (let i = items.length - 1; i >= 0; i--) {
                let item = items[i];
                let dx = player.x - item.x;
                let dy = player.y - item.y;
                let dist = Math.sqrt(dx*dx + dy*dy);
                
                if (dist < player.size + item.size) {
                    if (item.type === 'gold') {
                        player.gold += item.value;
                        showFloatingText(item.x, item.y, `+${item.value}💰`, '#ffd700');
                    } else if (item.type === 'potion') {
                        player.health = Math.min(player.maxHealth, player.health + item.value);
                        showFloatingText(item.x, item.y, `+${item.value}❤️`, '#ff6b6b');
                    }
                    items.splice(i, 1);
                }
            }
            
            // Проверка коллизий
            if (player.invincible > 0) {
                player.invincible--;
            } else {
                for (let e of enemies) {
                    let dx = player.x - e.x;
                    let dy = player.y - e.y;
                    let dist = Math.sqrt(dx*dx + dy*dy);
                    
                    if (dist < player.size + e.size) {
                        let damage = Math.max(1, e.power - player.defense);
                        player.health -= damage;
                        player.invincible = 30;
                        showDamage(player.x, player.y, damage);
                        
                        if (player.health <= 0) {
                            showFloatingText(400, 300, 'GAME OVER', '#ff0000');
                            gameStarted = false;
                        }
                    }
                }
            }
            
            player.attackCooldown--;
            
            // Обновление UI
            document.getElementById('healthVal').textContent = player.health;
            document.getElementById('powerVal').textContent = player.power;
            document.getElementById('defenseVal').textContent = player.defense;
            document.getElementById('levelVal').textContent = player.level;
            document.getElementById('goldVal').textContent = player.gold;
            
            draw();
        }
        
        // ==================== ВЫБОР ГЕРОЯ ====================
        function selectHero(hero) {
            selectedHero = hero;
            document.querySelectorAll('.hero-option').forEach(opt => {
                opt.style.background = 'rgba(184, 155, 123, 0.2)';
            });
            event.currentTarget.style.background = 'rgba(184, 155, 123, 0.4)';
        }
        
        // ==================== СТАРТ ИГРЫ ====================
        function startGame() {
            let hero = heroes[selectedHero];
            player.health = hero.health;
            player.maxHealth = hero.health;
            player.power = hero.power;
            player.defense = hero.defense;
            player.speed = hero.speed;
            player.color = hero.color;
            
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'block';
            gameStarted = true;
            
            // Запуск игрового цикла
            setInterval(update, 1000/60);
        }
        
        // ==================== УПРАВЛЕНИЕ КНОПКАМИ ====================
        attackBtn.addEventListener('click', attack);
        
        document.getElementById('skillBtn').addEventListener('click', () => {
            // Умение пока не реализовано
        });
        
        document.getElementById('pauseBtn').addEventListener('click', () => {
            gameStarted = !gameStarted;
        });
    </script>
</body>
</html>
