<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LEGENDARY ARENA — ТОП RPG</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
        }
        
        #gameContainer {
            position: relative;
            width: 400px;
            height: 700px;
            background: linear-gradient(145deg, #1a2a3a, #0f1a2a);
            border-radius: 30px;
            overflow: hidden;
            border: 3px solid #ffd700;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 500px;
            background: #2a4a6a;
            touch-action: none;
            cursor: crosshair;
        }
        
        .ui-panel {
            height: 200px;
            background: #1a1a2a;
            padding: 10px;
            color: white;
            border-top: 3px solid #ffd700;
            overflow-y: auto;
        }
        
        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 10px;
            background: #2a2a3a;
            padding: 8px;
            border-radius: 10px;
        }
        
        .inventory {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            margin-bottom: 10px;
        }
        
        .item-slot {
            background: #2a2a3a;
            border: 2px solid #ffd700;
            border-radius: 8px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
        }
        
        .item-slot:active {
            background: #ffd700;
            color: #000;
        }
        
        .controls {
            display: flex;
            gap: 10px;
        }
        
        .ctrl-btn {
            background: #ffd700;
            border: none;
            border-radius: 20px;
            padding: 12px;
            color: #000;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            flex: 1;
        }
        
        .ctrl-btn:active {
            transform: scale(0.95);
        }
        
        #attackBtn { background: #c44; color: white; }
        #skillBtn { background: #44a; color: white; }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="400" height="500"></canvas>
        
        <div class="ui-panel">
            <div class="stats">
                <div>❤️ <span id="hp">100</span>/100</div>
                <div>⚔️ <span id="atk">25</span></div>
                <div>🛡️ <span id="def">15</span></div>
                <div>📊 <span id="lvl">1</span></div>
                <div>💰 <span id="gold">100</span></div>
            </div>
            
            <div class="inventory" id="inventory">
                <div class="item-slot" onclick="useItem(0)">⚔️ Меч</div>
                <div class="item-slot" onclick="useItem(1)">🛡️ Щит</div>
                <div class="item-slot" onclick="useItem(2)">⛑️ Шлем</div>
                <div class="item-slot" onclick="useItem(3)">🧪 Зелье x3</div>
            </div>
            
            <div class="controls">
                <button class="ctrl-btn" id="attackBtn">⚔️ АТАКА</button>
                <button class="ctrl-btn" id="skillBtn">✨ МАГИЯ</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // ==================== ИГРОК ====================
        let player = {
            x: 200, y: 250,
            health: 100,
            maxHealth: 100,
            attack: 25,
            defense: 15,
            level: 1,
            exp: 0,
            expToNext: 100,
            gold: 100,
            mana: 50,
            maxMana: 50,
            attackCooldown: 0,
            invincible: 0,
            speed: 3,
            weapon: { name: 'Меч', damage: 5, equipped: true },
            armor: { name: 'Щит', defense: 3, equipped: true },
            helmet: { name: 'Шлем', defense: 2, equipped: true },
            potions: 3
        };
        
        // ==================== ВРАГИ ====================
        let enemies = [
            { x: 300, y: 200, health: 80, maxHealth: 80, attack: 12, defense: 5, exp: 30, gold: 20, speed: 1.5, size: 20, type: 'goblin' },
            { x: 100, y: 300, health: 80, maxHealth: 80, attack: 12, defense: 5, exp: 30, gold: 20, speed: 1.5, size: 20, type: 'goblin' }
        ];
        
        // ==================== БОСС ====================
        let boss = {
            x: 200, y: 100,
            health: 500,
            maxHealth: 500,
            attack: 30,
            defense: 15,
            exp: 200,
            gold: 200,
            speed: 0.8,
            size: 40,
            type: 'boss',
            active: true
        };
        
        // ==================== РИСОВАНИЕ ====================
        function draw() {
            ctx.clearRect(0, 0, 400, 500);
            
            // Пол
            ctx.fillStyle = '#3a5a3a';
            ctx.fillRect(0, 0, 400, 500);
            
            // Трава
            ctx.fillStyle = '#2a4a2a';
            for (let i = 0; i < 50; i++) {
                ctx.fillRect(Math.random()*400, Math.random()*500, 2, 5);
            }
            
            // Босс
            if (boss.active && boss.health > 0) {
                // Тело босса
                ctx.fillStyle = '#a44';
                ctx.beginPath();
                ctx.arc(boss.x, boss.y, 30, 0, Math.PI*2);
                ctx.fill();
                
                // Глаза
                ctx.fillStyle = '#ff0';
                ctx.beginPath();
                ctx.arc(boss.x-10, boss.y-10, 5, 0, Math.PI*2);
                ctx.arc(boss.x+10, boss.y-10, 5, 0, Math.PI*2);
                ctx.fill();
                
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(boss.x-10, boss.y-10, 2, 0, Math.PI*2);
                ctx.arc(boss.x+10, boss.y-10, 2, 0, Math.PI*2);
                ctx.fill();
                
                // Рога
                ctx.fillStyle = '#622';
                ctx.fillRect(boss.x-20, boss.y-40, 5, 15);
                ctx.fillRect(boss.x+15, boss.y-40, 5, 15);
                
                // Полоска здоровья босса
                ctx.fillStyle = '#000';
                ctx.fillRect(boss.x-40, boss.y-50, 80, 8);
                let bossHp = boss.health / boss.maxHealth;
                ctx.fillStyle = '#f44';
                ctx.fillRect(boss.x-40, boss.y-50, 80 * bossHp, 8);
            }
            
            // Враги
            for (let e of enemies) {
                ctx.fillStyle = '#4a8';
                ctx.beginPath();
                ctx.arc(e.x, e.y, 15, 0, Math.PI*2);
                ctx.fill();
                
                // Глаза
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(e.x-5, e.y-5, 3, 0, Math.PI*2);
                ctx.arc(e.x+5, e.y-5, 3, 0, Math.PI*2);
                ctx.fill();
                
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(e.x-5, e.y-5, 1, 0, Math.PI*2);
                ctx.arc(e.x+5, e.y-5, 1, 0, Math.PI*2);
                ctx.fill();
                
                // Полоска здоровья
                ctx.fillStyle = '#000';
                ctx.fillRect(e.x-20, e.y-25, 40, 3);
                let hp = e.health / e.maxHealth;
                ctx.fillStyle = '#f44';
                ctx.fillRect(e.x-20, e.y-25, 40 * hp, 3);
            }
            
            // Игрок
            ctx.fillStyle = '#44a';
            ctx.beginPath();
            ctx.arc(player.x, player.y, 15, 0, Math.PI*2);
            ctx.fill();
            
            // Шлем
            ctx.fillStyle = '#88c';
            ctx.fillRect(player.x-10, player.y-25, 20, 8);
            
            // Глаза
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(player.x-5, player.y-5, 2, 0, Math.PI*2);
            ctx.arc(player.x+5, player.y-5, 2, 0, Math.PI*2);
            ctx.fill();
            
            // Меч
            ctx.strokeStyle = '#aaa';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(player.x+15, player.y-5);
            ctx.lineTo(player.x+35, player.y-15);
            ctx.stroke();
            
            // Полоска здоровья игрока
            ctx.fillStyle = '#000';
            ctx.fillRect(player.x-20, player.y-35, 40, 4);
            let playerHp = player.health / player.maxHealth;
            ctx.fillStyle = '#4f4';
            ctx.fillRect(player.x-20, player.y-35, 40 * playerHp, 4);
            
            // Полоска маны
            ctx.fillStyle = '#000';
            ctx.fillRect(player.x-20, player.y-40, 40, 3);
            let mana = player.mana / player.maxMana;
            ctx.fillStyle = '#44f';
            ctx.fillRect(player.x-20, player.y-40, 40 * mana, 3);
        }
        
        // ==================== УПРАВЛЕНИЕ ====================
        let keys = {};
        
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            let touch = e.touches[0];
            let rect = canvas.getBoundingClientRect();
            let x = touch.clientX - rect.left;
            let y = touch.clientY - rect.top;
            
            // Джойстик в левой части экрана
            if (x < 150 && y > 350) {
                if (x < 50) keys['left'] = true;
                else if (x > 100) keys['right'] = true;
                else keys['up'] = true;
            }
        });
        
        canvas.addEventListener('touchend', () => {
            keys = {};
        });
        
        function movePlayer() {
            if (keys['left']) player.x -= player.speed;
            if (keys['right']) player.x += player.speed;
            if (keys['up']) player.y -= player.speed;
            
            player.x = Math.max(20, Math.min(380, player.x));
            player.y = Math.max(40, Math.min(460, player.y));
        }
        
        // ==================== АТАКА ====================
        function attack() {
            if (player.attackCooldown > 0) return;
            player.attackCooldown = 15;
            
            let totalDamage = player.attack + (player.weapon.equipped ? 5 : 0);
            
            // Атака по врагам
            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                let dx = e.x - player.x;
                let dy = e.y - player.y;
                let dist = Math.sqrt(dx*dx + dy*dy);
                
                if (dist < 50) {
                    let damage = totalDamage - e.defense;
                    if (damage < 1) damage = 1;
                    e.health -= damage;
                    
                    if (e.health <= 0) {
                        player.exp += e.exp;
                        player.gold += e.gold;
                        enemies.splice(i, 1);
                    }
                }
            }
            
            // Атака по боссу
            if (boss.active && boss.health > 0) {
                let dx = boss.x - player.x;
                let dy = boss.y - player.y;
                let dist = Math.sqrt(dx*dx + dy*dy);
                
                if (dist < 60) {
                    let damage = totalDamage - boss.defense;
                    if (damage < 1) damage = 1;
                    boss.health -= damage;
                    
                    if (boss.health <= 0) {
                        player.exp += boss.exp;
                        player.gold += boss.gold;
                        boss.active = false;
                    }
                }
            }
            
            // Проверка уровня
            while (player.exp >= player.expToNext) {
                player.level++;
                player.exp -= player.expToNext;
                player.expToNext = Math.floor(player.expToNext * 1.5);
                player.maxHealth += 20;
                player.health = player.maxHealth;
                player.attack += 3;
                player.defense += 2;
            }
        }
        
        // ==================== МАГИЯ ====================
        function castSpell() {
            if (player.mana < 20) return;
            player.mana -= 20;
            
            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                e.health -= 50;
                if (e.health <= 0) {
                    player.exp += e.exp;
                    player.gold += e.gold;
                    enemies.splice(i, 1);
                }
            }
            
            if (boss.active) {
                boss.health -= 100;
                if (boss.health <= 0) {
                    player.exp += boss.exp;
                    player.gold += boss.gold;
                    boss.active = false;
                }
            }
        }
        
        // ==================== ИНВЕНТАРЬ ====================
        function useItem(index) {
            if (index === 3 && player.potions > 0) { // Зелье
                player.health = Math.min(player.maxHealth, player.health + 30);
                player.potions--;
                updateInventory();
            } else if (index === 0) { // Меч
                player.weapon.equipped = !player.weapon.equipped;
            } else if (index === 1) { // Щит
                player.armor.equipped = !player.armor.equipped;
            }
        }
        
        function updateInventory() {
            let slots = document.querySelectorAll('.item-slot');
            slots[0].innerHTML = player.weapon.equipped ? '⚔️ Меч' : '⚔️ Меч (off)';
            slots[1].innerHTML = player.armor.equipped ? '🛡️ Щит' : '🛡️ Щит (off)';
            slots[2].innerHTML = '⛑️ Шлем';
            slots[3].innerHTML = `🧪 Зелье x${player.potions}`;
        }
        
        // ==================== ДВИЖЕНИЕ ВРАГОВ ====================
        function moveEnemies() {
            for (let e of enemies) {
                let dx = player.x - e.x;
                let dy = player.y - e.y;
                let dist = Math.sqrt(dx*dx + dy*dy);
                
                if (dist > 0) {
                    e.x += dx / dist * e.speed;
                    e.y += dy / dist * e.speed;
                }
                
                // Атака врага
                if (dist < 30 && player.invincible <= 0) {
                    let damage = e.attack - player.defense - (player.armor.equipped ? 3 : 0);
                    if (damage < 1) damage = 1;
                    player.health -= damage;
                    player.invincible = 20;
                }
            }
            
            // Движение босса
            if (boss.active && boss.health > 0) {
                let dx = player.x - boss.x;
                let dy = player.y - boss.y;
                let dist = Math.sqrt(dx*dx + dy*dy);
                
                if (dist > 0) {
                    boss.x += dx / dist * boss.speed;
                    boss.y += dy / dist * boss.speed;
                }
                
                if (dist < 40 && player.invincible <= 0) {
                    let damage = boss.attack - player.defense;
                    if (damage < 1) damage = 1;
                    player.health -= damage;
                    player.invincible = 30;
                }
            }
        }
        
        // ==================== ОБНОВЛЕНИЕ UI ====================
        function updateUI() {
            document.getElementById('hp').textContent = Math.floor(player.health);
            document.getElementById('atk').textContent = player.attack + (player.weapon.equipped ? 5 : 0);
            document.getElementById('def').textContent = player.defense + (player.armor.equipped ? 3 : 0);
            document.getElementById('lvl').textContent = player.level;
            document.getElementById('gold').textContent = player.gold;
        }
        
        // ==================== ИГРОВОЙ ЦИКЛ ====================
        function gameLoop() {
            movePlayer();
            moveEnemies();
            
            if (player.attackCooldown > 0) player.attackCooldown--;
            if (player.invincible > 0) player.invincible--;
            
            // Восстановление маны
            if (player.mana < player.maxMana) {
                player.mana += 0.1;
            }
            
            // Спавн новых врагов
            if (enemies.length < 2 && boss.active) {
                enemies.push({
                    x: Math.random() * 300 + 50,
                    y: Math.random() * 300 + 100,
                    health: 80,
                    maxHealth: 80,
                    attack: 12,
                    defense: 5,
                    exp: 30,
                    gold: 20,
                    speed: 1.5,
                    size: 20,
                    type: 'goblin'
                });
            }
            
            draw();
            updateUI();
            
            requestAnimationFrame(gameLoop);
        }
        
        document.getElementById('attackBtn').addEventListener('click', attack);
        document.getElementById('skillBtn').addEventListener('click', castSpell);
        
        gameLoop();
        updateInventory();
    </script>
</body>
</html>
