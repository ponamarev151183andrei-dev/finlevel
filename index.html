<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SPRITE RPG — РЕАЛИСТИЧНЫЕ ГЕРОИ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
        }
        
        #gameContainer {
            position: relative;
            width: 400px;
            height: 700px;
            background: #1a1a2a;
            border-radius: 30px;
            overflow: hidden;
            border: 4px solid #b89b7b;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 500px;
            background: #2a4a2a;
            touch-action: none;
        }
        
        .ui-panel {
            height: 200px;
            background: #2a1a0a;
            padding: 15px;
            color: #e6d5b8;
            border-top: 4px solid #b89b7b;
        }
        
        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
            background: rgba(184,155,123,0.2);
            padding: 10px;
            border-radius: 20px;
            border: 2px solid #b89b7b;
        }
        
        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 14px;
            color: #b89b7b;
        }
        
        .stat-value {
            font-size: 20px;
            font-weight: bold;
            color: #e6d5b8;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        .ctrl-btn {
            flex: 1;
            background: linear-gradient(145deg, #b89b7b, #8b6b4b);
            border: none;
            border-radius: 25px;
            padding: 15px;
            color: #1a0f0a;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            border-bottom: 4px solid #5a4a3a;
        }
        
        .ctrl-btn:active {
            transform: translateY(4px);
            border-bottom-width: 0;
        }
        
        #attackBtn {
            background: linear-gradient(145deg, #c44, #a22);
            color: white;
        }
        
        #skillBtn {
            background: linear-gradient(145deg, #44a, #228);
            color: white;
        }
        
        .joystick {
            position: absolute;
            bottom: 210px;
            left: 30px;
            width: 100px;
            height: 100px;
            background: rgba(0,0,0,0.5);
            border: 3px solid #b89b7b;
            border-radius: 60px;
            backdrop-filter: blur(5px);
            z-index: 100;
        }
        
        .joystick-handle {
            width: 50px;
            height: 50px;
            background: #b89b7b;
            border-radius: 30px;
            position: absolute;
            top: 25px;
            left: 25px;
            box-shadow: 0 0 20px #ffaa00;
            pointer-events: none;
        }
        
        .damage {
            position: absolute;
            color: #ffaa00;
            font-weight: bold;
            font-size: 24px;
            text-shadow: 2px 2px 0 #000;
            pointer-events: none;
            animation: floatUp 1s forwards;
        }
        
        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-60px) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="400" height="500"></canvas>
        
        <div class="joystick" id="joystick">
            <div class="joystick-handle" id="joystickHandle"></div>
        </div>
        
        <div class="ui-panel">
            <div class="stats">
                <div class="stat-item">❤️<div class="stat-value" id="hp">100</div></div>
                <div class="stat-item">⚔️<div class="stat-value" id="atk">15</div></div>
                <div class="stat-item">🛡️<div class="stat-value" id="def">10</div></div>
                <div class="stat-item">📊<div class="stat-value" id="lvl">1</div></div>
                <div class="stat-item">✨<div class="stat-value" id="exp">0/100</div></div>
            </div>
            
            <div class="controls">
                <button class="ctrl-btn" id="attackBtn">⚔️ АТАКА</button>
                <button class="ctrl-btn" id="skillBtn">✨ УМЕНИЕ</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // ==================== ИГРОК ====================
        let player = {
            x: 200, y: 250,
            health: 100,
            maxHealth: 100,
            attack: 15,
            defense: 10,
            level: 1,
            exp: 0,
            expToNext: 100,
            attackCooldown: 0,
            invincible: 0,
            speed: 4
        };
        
        // ==================== МОНСТРЫ ====================
        let monsters = [
            { x: 300, y: 150, health: 40, maxHealth: 40, attack: 8, defense: 2, exp: 25, speed: 1.5, type: 'goblin' },
            { x: 100, y: 350, health: 60, maxHealth: 60, attack: 12, defense: 4, exp: 40, speed: 1.2, type: 'skeleton' },
            { x: 200, y: 400, health: 80, maxHealth: 80, attack: 15, defense: 5, exp: 60, speed: 1.0, type: 'orc' }
        ];
        
        // ==================== ДЖОЙСТИК ====================
        let joystick = {
            active: false,
            startX: 0,
            startY: 0,
            currentX: 0,
            currentY: 0,
            handle: document.getElementById('joystickHandle')
        };
        
        const joystickArea = document.getElementById('joystick');
        
        joystickArea.addEventListener('touchstart', (e) => {
            e.preventDefault();
            let touch = e.touches[0];
            let rect = joystickArea.getBoundingClientRect();
            joystick.active = true;
            joystick.startX = rect.left + rect.width/2;
            joystick.startY = rect.top + rect.height/2;
        });
        
        joystickArea.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!joystick.active) return;
            
            let touch = e.touches[0];
            let dx = touch.clientX - joystick.startX;
            let dy = touch.clientY - joystick.startY;
            let distance = Math.min(35, Math.sqrt(dx*dx + dy*dy));
            let angle = Math.atan2(dy, dx);
            
            joystick.currentX = Math.cos(angle) * distance;
            joystick.currentY = Math.sin(angle) * distance;
            
            joystick.handle.style.transform = `translate(${25 + joystick.currentX}px, ${25 + joystick.currentY}px)`;
        });
        
        joystickArea.addEventListener('touchend', (e) => {
            e.preventDefault();
            joystick.active = false;
            joystick.currentX = 0;
            joystick.currentY = 0;
            joystick.handle.style.transform = 'translate(25px, 25px)';
        });
        
        function movePlayer() {
            if (joystick.active) {
                player.x += joystick.currentX / 10 * player.speed;
                player.y += joystick.currentY / 10 * player.speed;
            }
            
            player.x = Math.max(25, Math.min(375, player.x));
            player.y = Math.max(30, Math.min(470, player.y));
        }
        
        // ==================== РИСОВАНИЕ СПРАЙТОВ ====================
        function drawKnight(x, y) {
            // Тело (доспех)
            ctx.fillStyle = '#44a';
            ctx.fillRect(x-12, y-10, 24, 30);
            
            // Голова
            ctx.fillStyle = '#e0b07a';
            ctx.beginPath();
            ctx.arc(x, y-20, 10, 0, Math.PI*2);
            ctx.fill();
            
            // Шлем
            ctx.fillStyle = '#66c';
            ctx.fillRect(x-8, y-28, 16, 6);
            
            // Глаза
            ctx.fillStyle = '#fff';
            ctx.fillRect(x-5, y-24, 3, 3);
            ctx.fillRect(x+2, y-24, 3, 3);
            
            // Плащ
            ctx.fillStyle = '#a44';
            ctx.beginPath();
            ctx.moveTo(x-5, y+5);
            ctx.lineTo(x-15, y+15);
            ctx.lineTo(x+5, y+15);
            ctx.fill();
            
            // Меч
            ctx.fillStyle = '#aaa';
            ctx.fillRect(x+15, y-5, 20, 4);
            ctx.fillRect(x+30, y-8, 4, 8);
            
            // Щит
            ctx.fillStyle = '#864';
            ctx.fillRect(x-20, y-8, 8, 15);
            ctx.fillStyle = '#a86';
            ctx.fillRect(x-22, y-10, 12, 3);
        }
        
        function drawGoblin(x, y) {
            // Тело
            ctx.fillStyle = '#4a8';
            ctx.fillRect(x-10, y-5, 20, 25);
            
            // Голова
            ctx.fillStyle = '#6a4';
            ctx.beginPath();
            ctx.arc(x, y-15, 9, 0, Math.PI*2);
            ctx.fill();
            
            // Глаза
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(x-4, y-18, 2, 0, Math.PI*2);
            ctx.arc(x+4, y-18, 2, 0, Math.PI*2);
            ctx.fill();
            
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(x-4, y-18, 1, 0, Math.PI*2);
            ctx.arc(x+4, y-18, 1, 0, Math.PI*2);
            ctx.fill();
            
            // Уши
            ctx.fillStyle = '#4a8';
            ctx.beginPath();
            ctx.ellipse(x-8, y-20, 2, 5, -0.2, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(x+8, y-20, 2, 5, 0.2, 0, Math.PI*2);
            ctx.fill();
            
            // Копьё
            ctx.fillStyle = '#654';
            ctx.fillRect(x+8, y-15, 15, 3);
            ctx.fillRect(x+20, y-20, 3, 10);
        }
        
        function drawSkeleton(x, y) {
            // Тело
            ctx.fillStyle = '#ddd';
            ctx.fillRect(x-8, y-5, 16, 25);
            
            // Голова
            ctx.beginPath();
            ctx.arc(x, y-18, 8, 0, Math.PI*2);
            ctx.fill();
            
            // Глаза
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(x-3, y-20, 1.5, 0, Math.PI*2);
            ctx.arc(x+3, y-20, 1.5, 0, Math.PI*2);
            ctx.fill();
            
            // Меч
            ctx.fillStyle = '#888';
            ctx.fillRect(x+8, y-10, 20, 3);
            ctx.fillRect(x+23, y-15, 3, 12);
        }
        
        function drawOrc(x, y) {
            // Тело
            ctx.fillStyle = '#a44';
            ctx.fillRect(x-12, y-8, 24, 28);
            
            // Голова
            ctx.fillStyle = '#c64';
            ctx.beginPath();
            ctx.arc(x, y-18, 11, 0, Math.PI*2);
            ctx.fill();
            
            // Глаза
            ctx.fillStyle = '#ff0';
            ctx.beginPath();
            ctx.arc(x-5, y-22, 3, 0, Math.PI*2);
            ctx.arc(x+5, y-22, 3, 0, Math.PI*2);
            ctx.fill();
            
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(x-5, y-22, 1.5, 0, Math.PI*2);
            ctx.arc(x+5, y-22, 1.5, 0, Math.PI*2);
            ctx.fill();
            
            // Клыки
            ctx.fillStyle = '#fff';
            ctx.fillRect(x-5, y-12, 2, 4);
            ctx.fillRect(x+3, y-12, 2, 4);
            
            // Топор
            ctx.fillStyle = '#642';
            ctx.fillRect(x+15, y-10, 20, 5);
            ctx.fillRect(x+30, y-15, 5, 12);
        }
        
        function draw() {
            ctx.clearRect(0, 0, 400, 500);
            
            // Фон
            ctx.fillStyle = '#3a5a3a';
            ctx.fillRect(0, 0, 400, 500);
            
            // Текстура
            ctx.fillStyle = '#2a4a2a';
            for (let i = 0; i < 30; i++) {
                ctx.fillRect(Math.random()*400, Math.random()*500, 4, 8);
            }
            
            // Рисуем монстров
            monsters.forEach(m => {
                if (m.type === 'goblin') drawGoblin(m.x, m.y);
                else if (m.type === 'skeleton') drawSkeleton(m.x, m.y);
                else if (m.type === 'orc') drawOrc(m.x, m.y);
                
                // Полоска здоровья
                ctx.fillStyle = '#000';
                ctx.fillRect(m.x-15, m.y-25, 30, 4);
                let hpPercent = m.health / m.maxHealth;
                ctx.fillStyle = '#f44';
                ctx.fillRect(m.x-15, m.y-25, 30 * hpPercent, 4);
            });
            
            // Рисуем игрока
            drawKnight(player.x, player.y);
            
            // Полоска здоровья игрока
            ctx.fillStyle = '#000';
            ctx.fillRect(player.x-20, player.y-35, 40, 4);
            let hpPercent = player.health / player.maxHealth;
            ctx.fillStyle = '#4f4';
            ctx.fillRect(player.x-20, player.y-35, 40 * hpPercent, 4);
            
            // Уровень
            ctx.fillStyle = '#ffd700';
            ctx.font = '12px Arial';
            ctx.fillText('Ур.' + player.level, player.x-15, player.y-45);
        }
        
        // ==================== АТАКА ====================
        function attack() {
            if (player.attackCooldown > 0) return;
            player.attackCooldown = 15;
            
            for (let i = monsters.length - 1; i >= 0; i--) {
                let m = monsters[i];
                let dx = m.x - player.x;
                let dy = m.y - player.y;
                let dist = Math.sqrt(dx*dx + dy*dy);
                
                if (dist < 40) {
                    let damage = player.attack - m.defense;
                    if (damage < 1) damage = 1;
                    m.health -= damage;
                    
                    if (m.health <= 0) {
                        player.exp += m.exp;
                        monsters.splice(i, 1);
                        
                        while (player.exp >= player.expToNext) {
                            player.level++;
                            player.exp -= player.expToNext;
                            player.expToNext = Math.floor(player.expToNext * 1.5);
                            player.maxHealth += 20;
                            player.health = player.maxHealth;
                            player.attack += 3;
                            player.defense += 2;
                        }
                    }
                }
            }
        }
        
        // ==================== УМЕНИЕ ====================
        function useSkill() {
            monsters.forEach(m => m.health -= 30);
        }
        
        // ==================== ДВИЖЕНИЕ МОНСТРОВ ====================
        function moveMonsters() {
            monsters.forEach(m => {
                let dx = player.x - m.x;
                let dy = player.y - m.y;
                let dist = Math.sqrt(dx*dx + dy*dy);
                
                if (dist > 0) {
                    m.x += dx / dist * m.speed;
                    m.y += dy / dist * m.speed;
                }
            });
        }
        
        // ==================== ОБНОВЛЕНИЕ UI ====================
        function updateUI() {
            document.getElementById('hp').textContent = player.health;
            document.getElementById('atk').textContent = player.attack;
            document.getElementById('def').textContent = player.defense;
            document.getElementById('lvl').textContent = player.level;
            document.getElementById('exp').textContent = player.exp + '/' + player.expToNext;
        }
        
        // ==================== ИГРОВОЙ ЦИКЛ ====================
        function gameLoop() {
            movePlayer();
            moveMonsters();
            
            if (player.attackCooldown > 0) player.attackCooldown--;
            
            draw();
            updateUI();
            
            requestAnimationFrame(gameLoop);
        }
        
        document.getElementById('attackBtn').addEventListener('click', attack);
        document.getElementById('skillBtn').addEventListener('click', useSkill);
        
        gameLoop();
    </script>
</body>
</html>
