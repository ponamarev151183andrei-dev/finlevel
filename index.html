<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HERO'S PATH — БОЛЬШАЯ КАРТА</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
        }
        
        #gameContainer {
            position: relative;
            width: 400px;
            height: 700px;
            background: #1a1a2a;
            border-radius: 30px;
            overflow: hidden;
            border: 4px solid #b89b7b;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 500px;
            background: #2a4a2a;
            touch-action: none;
        }
        
        .ui-panel {
            height: 200px;
            background: #2a1a0a;
            padding: 15px;
            color: #e6d5b8;
            border-top: 4px solid #b89b7b;
        }
        
        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
            background: rgba(184,155,123,0.2);
            padding: 10px;
            border-radius: 20px;
            border: 2px solid #b89b7b;
        }
        
        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 14px;
            color: #b89b7b;
        }
        
        .stat-value {
            font-size: 20px;
            font-weight: bold;
            color: #e6d5b8;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        .ctrl-btn {
            flex: 1;
            background: linear-gradient(145deg, #b89b7b, #8b6b4b);
            border: none;
            border-radius: 25px;
            padding: 15px;
            color: #1a0f0a;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            border-bottom: 4px solid #5a4a3a;
        }
        
        .ctrl-btn:active {
            transform: translateY(4px);
            border-bottom-width: 0;
        }
        
        #attackBtn {
            background: linear-gradient(145deg, #c44, #a22);
            color: white;
        }
        
        #skillBtn {
            background: linear-gradient(145deg, #44a, #228);
            color: white;
        }
        
        .joystick {
            position: absolute;
            bottom: 210px;
            left: 30px;
            width: 100px;
            height: 100px;
            background: rgba(0,0,0,0.5);
            border: 3px solid #b89b7b;
            border-radius: 60px;
            backdrop-filter: blur(5px);
            z-index: 100;
        }
        
        .joystick-handle {
            width: 50px;
            height: 50px;
            background: #b89b7b;
            border-radius: 30px;
            position: absolute;
            top: 25px;
            left: 25px;
            box-shadow: 0 0 20px #ffaa00;
            pointer-events: none;
        }
        
        .damage {
            position: absolute;
            color: #ffaa00;
            font-weight: bold;
            font-size: 24px;
            text-shadow: 2px 2px 0 #000;
            pointer-events: none;
            animation: floatUp 1s forwards;
        }
        
        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-60px) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="400" height="500"></canvas>
        
        <div class="joystick" id="joystick">
            <div class="joystick-handle" id="joystickHandle"></div>
        </div>
        
        <div class="ui-panel">
            <div class="stats">
                <div class="stat-item">❤️<div class="stat-value" id="hp">100</div></div>
                <div class="stat-item">⚔️<div class="stat-value" id="atk">15</div></div>
                <div class="stat-item">🛡️<div class="stat-value" id="def">10</div></div>
                <div class="stat-item">📊<div class="stat-value" id="lvl">1</div></div>
                <div class="stat-item">✨<div class="stat-value" id="exp">0/100</div></div>
            </div>
            
            <div class="controls">
                <button class="ctrl-btn" id="attackBtn">⚔️ АТАКА</button>
                <button class="ctrl-btn" id="skillBtn">✨ УМЕНИЕ</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // ==================== РАЗМЕРЫ МИРА ====================
        const WORLD_WIDTH = 2000;
        const WORLD_HEIGHT = 2000;
        
        // ==================== КАМЕРА ====================
        let camera = {
            x: 0,
            y: 0,
            width: 400,
            height: 500
        };
        
        // ==================== ИГРОК ====================
        let player = {
            x: 1000,
            y: 1000,
            health: 100,
            maxHealth: 100,
            attack: 15,
            defense: 10,
            level: 1,
            exp: 0,
            expToNext: 100,
            attackCooldown: 0,
            invincible: 0,
            speed: 5,
            weapon: 2,
            armor: 1
        };
        
        // ==================== МОНСТРЫ ====================
        let monsters = [
            { x: 300, y: 300, health: 40, maxHealth: 40, attack: 8, defense: 2, exp: 25, speed: 1.5, size: 20 },
            { x: 1500, y: 500, health: 60, maxHealth: 60, attack: 12, defense: 4, exp: 40, speed: 1.2, size: 22 },
            { x: 800, y: 1600, health: 80, maxHealth: 80, attack: 15, defense: 5, exp: 60, speed: 1.0, size: 24 },
            { x: 1700, y: 1700, health: 50, maxHealth: 50, attack: 10, defense: 3, exp: 35, speed: 2.0, size: 18 },
            { x: 400, y: 1200, health: 70, maxHealth: 70, attack: 14, defense: 4, exp: 45, speed: 1.3, size: 21 }
        ];
        
        // ==================== ДЖОЙСТИК ====================
        let joystick = {
            active: false,
            startX: 0,
            startY: 0,
            currentX: 0,
            currentY: 0,
            handle: document.getElementById('joystickHandle')
        };
        
        const joystickArea = document.getElementById('joystick');
        
        joystickArea.addEventListener('touchstart', (e) => {
            e.preventDefault();
            let touch = e.touches[0];
            let rect = joystickArea.getBoundingClientRect();
            joystick.active = true;
            joystick.startX = rect.left + rect.width/2;
            joystick.startY = rect.top + rect.height/2;
        });
        
        joystickArea.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!joystick.active) return;
            
            let touch = e.touches[0];
            let dx = touch.clientX - joystick.startX;
            let dy = touch.clientY - joystick.startY;
            let distance = Math.min(35, Math.sqrt(dx*dx + dy*dy));
            let angle = Math.atan2(dy, dx);
            
            joystick.currentX = Math.cos(angle) * distance;
            joystick.currentY = Math.sin(angle) * distance;
            
            joystick.handle.style.transform = `translate(${25 + joystick.currentX}px, ${25 + joystick.currentY}px)`;
        });
        
        joystickArea.addEventListener('touchend', (e) => {
            e.preventDefault();
            joystick.active = false;
            joystick.currentX = 0;
            joystick.currentY = 0;
            joystick.handle.style.transform = 'translate(25px, 25px)';
        });
        
        function movePlayer() {
            if (joystick.active) {
                player.x += joystick.currentX / 10 * player.speed;
                player.y += joystick.currentY / 10 * player.speed;
            }
            
            // Границы мира
            player.x = Math.max(20, Math.min(WORLD_WIDTH - 20, player.x));
            player.y = Math.max(20, Math.min(WORLD_HEIGHT - 20, player.y));
            
            // Двигаем камеру за игроком
            camera.x = player.x - camera.width/2;
            camera.y = player.y - camera.height/2;
            
            // Не выходим за границы мира
            camera.x = Math.max(0, Math.min(WORLD_WIDTH - camera.width, camera.x));
            camera.y = Math.max(0, Math.min(WORLD_HEIGHT - camera.height, camera.y));
        }
        
        // ==================== РИСОВАНИЕ МИРА ====================
        function drawWorld() {
            // Небо
            ctx.fillStyle = '#7ec8e0';
            ctx.fillRect(0, 0, 400, 500);
            
            // Облака
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            ctx.beginPath();
            ctx.arc(50, 80, 25, 0, Math.PI*2);
            ctx.arc(80, 70, 20, 0, Math.PI*2);
            ctx.arc(110, 80, 30, 0, Math.PI*2);
            ctx.fill();
            
            ctx.beginPath();
            ctx.arc(250, 120, 30, 0, Math.PI*2);
            ctx.arc(280, 110, 25, 0, Math.PI*2);
            ctx.arc(310, 120, 35, 0, Math.PI*2);
            ctx.fill();
            
            // Дальние горы
            ctx.fillStyle = '#5a7a6a';
            ctx.beginPath();
            ctx.moveTo(0, 300);
            ctx.lineTo(100, 200);
            ctx.lineTo(200, 250);
            ctx.lineTo(300, 150);
            ctx.lineTo(400, 200);
            ctx.lineTo(400, 300);
            ctx.fill();
            
            ctx.fillStyle = '#4a6a5a';
            ctx.beginPath();
            ctx.moveTo(0, 350);
            ctx.lineTo(150, 220);
            ctx.lineTo(250, 280);
            ctx.lineTo(350, 180);
            ctx.lineTo(400, 220);
            ctx.lineTo(400, 350);
            ctx.fill();
            
            // Лес
            for (let i = 0; i < 15; i++) {
                let wx = 100 + i * 150;
                let wy = 400 + Math.sin(i) * 50;
                
                let screenX = wx - camera.x;
                let screenY = wy - camera.y;
                
                if (screenX > -50 && screenX < 450 && screenY > -50 && screenY < 550) {
                    ctx.fillStyle = '#5a3a2a';
                    ctx.fillRect(screenX-5, screenY, 10, 40);
                    
                    ctx.fillStyle = '#2a7a2a';
                    ctx.beginPath();
                    ctx.arc(screenX, screenY-15, 18, 0, Math.PI*2);
                    ctx.fill();
                }
            }
            
            // Замок
            let castleX = 1500 - camera.x;
            let castleY = 800 - camera.y;
            
            if (castleX > -100 && castleX < 500 && castleY > -100 && castleY < 600) {
                ctx.fillStyle = '#8a6a4a';
                ctx.fillRect(castleX-40, castleY-50, 80, 100);
                
                ctx.fillStyle = '#a88a6a';
                ctx.fillRect(castleX-20, castleY-70, 10, 30);
                ctx.fillRect(castleX+10, castleY-70, 10, 30);
                
                ctx.fillStyle = '#f44';
                ctx.fillRect(castleX-5, castleY-85, 20, 5);
            }
            
            // Озеро
            let lakeX = 300 - camera.x;
            let lakeY = 1500 - camera.y;
            
            if (lakeX > -50 && lakeX < 450 && lakeY > -50 && lakeY < 550) {
                ctx.fillStyle = '#3a8ad0';
                ctx.beginPath();
                ctx.ellipse(lakeX, lakeY, 80, 40, 0, 0, Math.PI*2);
                ctx.fill();
                
                ctx.fillStyle = '#5aa0e0';
                ctx.beginPath();
                ctx.ellipse(lakeX-20, lakeY-10, 20, 10, 0, 0, Math.PI*2);
                ctx.fill();
            }
            
            // Трава на переднем плане
            ctx.fillStyle = '#3a5a3a';
            ctx.fillRect(0, 400, 400, 100);
            
            ctx.fillStyle = '#2a4a2a';
            for (let i = 0; i < 30; i++) {
                ctx.fillRect(Math.random()*400, 400 + Math.random()*100, 5, 10);
            }
        }
        
        // ==================== РИСОВАНИЕ МОНСТРОВ ====================
        function drawMonsters() {
            monsters.forEach(m => {
                let screenX = m.x - camera.x;
                let screenY = m.y - camera.y;
                
                if (screenX > -30 && screenX < 430 && screenY > -30 && screenY < 530) {
                    // Тень
                    ctx.fillStyle = 'rgba(0,0,0,0.3)';
                    ctx.beginPath();
                    ctx.ellipse(screenX, screenY + m.size/2, m.size/2, m.size/4, 0, 0, Math.PI*2);
                    ctx.fill();
                    
                    // Тело
                    ctx.fillStyle = m.size > 22 ? '#c44' : '#4a8';
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, m.size/2, 0, Math.PI*2);
                    ctx.fill();
                    
                    // Глаза
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(screenX-4, screenY-4, 3, 0, Math.PI*2);
                    ctx.arc(screenX+4, screenY-4, 3, 0, Math.PI*2);
                    ctx.fill();
                    
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.arc(screenX-4, screenY-4, 1, 0, Math.PI*2);
                    ctx.arc(screenX+4, screenY-4, 1, 0, Math.PI*2);
                    ctx.fill();
                    
                    // Полоска здоровья
                    ctx.fillStyle = '#000';
                    ctx.fillRect(screenX-15, screenY-20, 30, 4);
                    let hpPercent = m.health / m.maxHealth;
                    ctx.fillStyle = '#f44';
                    ctx.fillRect(screenX-15, screenY-20, 30 * hpPercent, 4);
                }
            });
        }
        
        // ==================== РИСОВАНИЕ ИГРОКА ====================
        function drawPlayer() {
            let screenX = 200; // центр экрана
            let screenY = 250;
            
            // Тень
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.ellipse(screenX, screenY + 15, 15, 5, 0, 0, Math.PI*2);
            ctx.fill();
            
            // Тело
            ctx.fillStyle = '#44a';
            ctx.beginPath();
            ctx.arc(screenX, screenY, 15, 0, Math.PI*2);
            ctx.fill();
            
            // Шлем
            ctx.fillStyle = '#66c';
            ctx.fillRect(screenX-8, screenY-18, 16, 6);
            
            // Глаза
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(screenX-5, screenY-5, 3, 0, Math.PI*2);
            ctx.arc(screenX+5, screenY-5, 3, 0, Math.PI*2);
            ctx.fill();
            
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(screenX-5, screenY-5, 1, 0, Math.PI*2);
            ctx.arc(screenX+5, screenY-5, 1, 0, Math.PI*2);
            ctx.fill();
            
            // Оружие
            ctx.fillStyle = '#aaa';
            ctx.fillRect(screenX+15, screenY-5, 20, 4);
            ctx.fillRect(screenX+30, screenY-8, 4, 8);
            
            // Полоска здоровья
            ctx.fillStyle = '#000';
            ctx.fillRect(screenX-20, screenY-30, 40, 4);
            ctx.fillStyle = '#4f4';
            ctx.fillRect(screenX-20, screenY-30, 40 * (player.health/player.maxHealth), 4);
            
            // Уровень
            ctx.fillStyle = '#ffd700';
            ctx.font = '12px Arial';
            ctx.fillText('Ур.' + player.level, screenX-15, screenY-40);
        }
        
        // ==================== АТАКА ====================
        function attack() {
            if (player.attackCooldown > 0) return;
            player.attackCooldown = 15;
            
            let totalAttack = player.attack + (player.weapon || 0);
            
            for (let i = monsters.length - 1; i >= 0; i--) {
                let m = monsters[i];
                let dx = m.x - player.x;
                let dy = m.y - player.y;
                let dist = Math.sqrt(dx*dx + dy*dy);
                
                if (dist < 50) {
                    let damage = totalAttack - m.defense;
                    if (damage < 1) damage = 1;
                    m.health -= damage;
                    
                    if (m.health <= 0) {
                        player.exp += m.exp;
                        monsters.splice(i, 1);
                        
                        while (player.exp >= player.expToNext) {
                            player.level++;
                            player.exp -= player.expToNext;
                            player.expToNext = Math.floor(player.expToNext * 1.5);
                            player.maxHealth += 20;
                            player.health = player.maxHealth;
                            player.attack += 3;
                            player.defense += 2;
                        }
                    }
                }
            }
        }
        
        // ==================== УМЕНИЕ ====================
        function useSkill() {
            monsters.forEach(m => m.health -= 30);
        }
        
        // ==================== ОБНОВЛЕНИЕ UI ====================
        function updateUI() {
            document.getElementById('hp').textContent = player.health;
            document.getElementById('atk').textContent = player.attack + (player.weapon || 0);
            document.getElementById('def').textContent = player.defense + (player.armor || 0);
            document.getElementById('lvl').textContent = player.level;
            document.getElementById('exp').textContent = player.exp + '/' + player.expToNext;
        }
        
        // ==================== ДВИЖЕНИЕ МОНСТРОВ ====================
        function moveMonsters() {
            monsters.forEach(m => {
                let dx = player.x - m.x;
                let dy = player.y - m.y;
                let dist = Math.sqrt(dx*dx + dy*dy);
                
                if (dist > 0) {
                    m.x += dx / dist * m.speed;
                    m.y += dy / dist * m.speed;
                }
            });
        }
        
        // ==================== ИГРОВОЙ ЦИКЛ ====================
        function gameLoop() {
            movePlayer();
            moveMonsters();
            
            if (player.attackCooldown > 0) player.attackCooldown--;
            
            drawWorld();
            drawMonsters();
            drawPlayer();
            updateUI();
            
            requestAnimationFrame(gameLoop);
        }
        
        document.getElementById('attackBtn').addEventListener('click', attack);
        document.getElementById('skillBtn').addEventListener('click', useSkill);
        
        gameLoop();
    </script>
</body>
</html>
