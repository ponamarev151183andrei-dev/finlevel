<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PIXEL LEGEND — 2D RPG</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        
        body {
            background: #1a1a2a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
        }
        
        #gameContainer {
            position: relative;
            width: 400px;
            height: 700px;
            background: #2a2a3a;
            border-radius: 20px;
            overflow: hidden;
            border: 4px solid #ffaa00;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 500px;
            background: #3a5a3a;
            touch-action: none;
            cursor: crosshair;
            image-rendering: pixelated;
        }
        
        .ui-panel {
            height: 200px;
            background: #2a2a3a;
            padding: 15px;
            color: #ffaa00;
            border-top: 4px solid #ffaa00;
            overflow-y: auto;
        }
        
        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
            background: #1a1a2a;
            padding: 10px;
            border-radius: 10px;
            border: 2px solid #ffaa00;
        }
        
        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 14px;
            color: #ffaa00;
        }
        
        .stat-value {
            font-size: 18px;
            font-weight: bold;
            color: white;
        }
        
        .inventory {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }
        
        .item-slot {
            background: #1a1a2a;
            border: 2px solid #ffaa00;
            border-radius: 8px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.1s;
        }
        
        .item-slot:active {
            background: #ffaa00;
            color: #1a1a2a;
        }
        
        .controls {
            display: flex;
            gap: 10px;
        }
        
        .ctrl-btn {
            flex: 1;
            background: #ffaa00;
            border: none;
            border-radius: 20px;
            padding: 12px;
            color: #1a1a2a;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            border-bottom: 4px solid #886600;
            transition: all 0.1s;
        }
        
        .ctrl-btn:active {
            transform: translateY(4px);
            border-bottom-width: 0;
        }
        
        #attackBtn { background: #ff4444; color: white; }
        #skillBtn { background: #4444ff; color: white; }
        
        .joystick {
            position: absolute;
            bottom: 210px;
            left: 20px;
            width: 80px;
            height: 80px;
            background: rgba(0,0,0,0.6);
            border: 3px solid #ffaa00;
            border-radius: 40px;
            backdrop-filter: blur(5px);
        }
        
        .damage {
            position: absolute;
            color: #ffaa00;
            font-weight: bold;
            font-size: 20px;
            pointer-events: none;
            animation: floatUp 1s forwards;
        }
        
        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-50px); opacity: 0; }
        }
        
        .level-up {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffaa00;
            font-size: 30px;
            font-weight: bold;
            animation: pulse 2s;
        }
        
        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.5); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="400" height="500"></canvas>
        
        <div class="ui-panel">
            <div class="stats">
                <div class="stat-item">❤️<div class="stat-value" id="hp">100</div></div>
                <div class="stat-item">⚔️<div class="stat-value" id="atk">20</div></div>
                <div class="stat-item">🛡️<div class="stat-value" id="def">10</div></div>
                <div class="stat-item">📊<div class="stat-value" id="lvl">1</div></div>
                <div class="stat-item">💰<div class="stat-value" id="gold">0</div></div>
            </div>
            
            <div class="inventory" id="inventory">
                <div class="item-slot" onclick="useItem(0)">⚔️</div>
                <div class="item-slot" onclick="useItem(1)">🛡️</div>
                <div class="item-slot" onclick="useItem(2)">⛑️</div>
                <div class="item-slot" onclick="useItem(3)">🧪 x3</div>
            </div>
            
            <div class="controls">
                <button class="ctrl-btn" id="attackBtn">⚔️ АТАКА</button>
                <button class="ctrl-btn" id="skillBtn">✨ МАГИЯ</button>
            </div>
        </div>
        
        <div class="joystick" id="joystick"></div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // ==================== ИГРОК ====================
        let player = {
            x: 200, y: 250,
            health: 100,
            maxHealth: 100,
            attack: 20,
            defense: 10,
            level: 1,
            exp: 0,
            expToNext: 100,
            gold: 0,
            attackCooldown: 0,
            invincible: 0,
            speed: 3,
            weapon: { damage: 5, equipped: true },
            armor: { defense: 3, equipped: true },
            potions: 3,
            frame: 0,
            direction: 'down'
        };
        
        // ==================== МОНСТРЫ ====================
        let monsters = [
            {
                type: 'goblin',
                x: 300, y: 200,
                health: 50,
                maxHealth: 50,
                attack: 8,
                defense: 2,
                exp: 20,
                gold: 10,
                speed: 1.5,
                size: 20,
                frame: 0
            },
            {
                type: 'skeleton',
                x: 100, y: 300,
                health: 80,
                maxHealth: 80,
                attack: 12,
                defense: 3,
                exp: 30,
                gold: 15,
                speed: 1.2,
                size: 22,
                frame: 0
            },
            {
                type: 'boss',
                x: 200, y: 100,
                health: 300,
                maxHealth: 300,
                attack: 20,
                defense: 8,
                exp: 100,
                gold: 50,
                speed: 0.8,
                size: 30,
                frame: 0
            }
        ];
        
        // ==================== РИСОВАНИЕ КАРТЫ ====================
        function drawMap() {
            // Пол
            ctx.fillStyle = '#3a5a3a';
            ctx.fillRect(0, 0, 400, 500);
            
            // Клетки
            ctx.strokeStyle = '#2a4a2a';
            ctx.lineWidth = 1;
            for (let i = 0; i < 20; i++) {
                for (let j = 0; j < 25; j++) {
                    ctx.strokeRect(i*20, j*20, 20, 20);
                }
            }
            
            // Деревья
            for (let i = 0; i < 5; i++) {
                let x = 50 + i * 70;
                let y = 100 + Math.sin(i) * 30;
                
                // Ствол
                ctx.fillStyle = '#8b5a2b';
                ctx.fillRect(x-3, y+10, 6, 20);
                
                // Крона
                ctx.fillStyle = '#2a7a2a';
                ctx.beginPath();
                ctx.arc(x, y, 15, 0, Math.PI*2);
                ctx.fill();
            }
            
            // Замок
            ctx.fillStyle = '#8a6a4a';
            ctx.fillRect(320, 100, 60, 100);
            
            // Башни
            ctx.fillStyle = '#a88a6a';
            ctx.fillRect(330, 60, 10, 40);
            ctx.fillRect(360, 60, 10, 40);
            
            // Флаг
            ctx.fillStyle = '#f44';
            ctx.fillRect(340, 45, 20, 5);
        }
        
        // ==================== РИСОВАНИЕ ИГРОКА ====================
        function drawPlayer() {
            player.frame += 0.1;
            
            // Тело
            ctx.fillStyle = '#44a';
            ctx.fillRect(player.x-10, player.y-15, 20, 25);
            
            // Голова
            ctx.fillStyle = '#e0b07a';
            ctx.beginPath();
            ctx.arc(player.x, player.y-25, 8, 0, Math.PI*2);
            ctx.fill();
            
            // Шлем
            ctx.fillStyle = '#66c';
            ctx.fillRect(player.x-6, player.y-33, 12, 6);
            
            // Глаза
            ctx.fillStyle = '#fff';
            ctx.fillRect(player.x-5, player.y-28, 3, 3);
            ctx.fillRect(player.x+2, player.y-28, 3, 3);
            
            // Оружие
            ctx.fillStyle = '#aaa';
            ctx.fillRect(player.x+12, player.y-22, 15, 3);
            ctx.fillRect(player.x+22, player.y-27, 3, 10);
            
            // Полоска здоровья
            ctx.fillStyle = '#000';
            ctx.fillRect(player.x-15, player.y-40, 30, 4);
            let hpPercent = player.health / player.maxHealth;
            ctx.fillStyle = '#4f4';
            ctx.fillRect(player.x-15, player.y-40, 30 * hpPercent, 4);
        }
        
        // ==================== РИСОВАНИЕ МОНСТРОВ ====================
        function drawMonsters() {
            for (let m of monsters) {
                if (m.health <= 0) continue;
                
                m.frame += 0.1;
                
                if (m.type === 'goblin') {
                    // Тело
                    ctx.fillStyle = '#4a8';
                    ctx.fillRect(m.x-10, m.y-10, 20, 20);
                    
                    // Голова
                    ctx.fillStyle = '#6a4';
                    ctx.beginPath();
                    ctx.arc(m.x, m.y-15, 7, 0, Math.PI*2);
                    ctx.fill();
                    
                    // Глаза
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(m.x-4, m.y-18, 3, 3);
                    ctx.fillRect(m.x+1, m.y-18, 3, 3);
                    
                } else if (m.type === 'skeleton') {
                    ctx.fillStyle = '#ddd';
                    ctx.fillRect(m.x-8, m.y-10, 16, 20);
                    ctx.beginPath();
                    ctx.arc(m.x, m.y-18, 6, 0, Math.PI*2);
                    ctx.fill();
                    
                    // Глаза
                    ctx.fillStyle = '#000';
                    ctx.fillRect(m.x-3, m.y-20, 2, 2);
                    ctx.fillRect(m.x+1, m.y-20, 2, 2);
                    
                } else if (m.type === 'boss') {
                    ctx.fillStyle = '#c44';
                    ctx.fillRect(m.x-15, m.y-20, 30, 30);
                    
                    ctx.beginPath();
                    ctx.arc(m.x, m.y-30, 10, 0, Math.PI*2);
                    ctx.fill();
                    
                    ctx.fillStyle = '#ff0';
                    ctx.fillRect(m.x-4, m.y-33, 3, 3);
                    ctx.fillRect(m.x+1, m.y-33, 3, 3);
                    
                    // Рога
                    ctx.fillStyle = '#622';
                    ctx.fillRect(m.x-10, m.y-40, 3, 8);
                    ctx.fillRect(m.x+7, m.y-40, 3, 8);
                }
                
                // Полоска здоровья
                ctx.fillStyle = '#000';
                ctx.fillRect(m.x-15, m.y-35, 30, 3);
                let hpPercent = m.health / m.maxHealth;
                ctx.fillStyle = '#f44';
                ctx.fillRect(m.x-15, m.y-35, 30 * hpPercent, 3);
            }
        }
        
        // ==================== АТАКА ====================
        function attack() {
            if (player.attackCooldown > 0) return;
            player.attackCooldown = 20;
            
            for (let i = monsters.length - 1; i >= 0; i--) {
                let m = monsters[i];
                let dx = m.x - player.x;
                let dy = m.y - player.y;
                let dist = Math.sqrt(dx*dx + dy*dy);
                
                if (dist < 40) {
                    let damage = player.attack + (player.weapon.equipped ? 5 : 0) - m.defense;
                    if (damage < 1) damage = 1;
                    
                    m.health -= damage;
                    showDamage(m.x, m.y, damage);
                    
                    if (m.health <= 0) {
                        player.exp += m.exp;
                        player.gold += m.gold;
                        monsters.splice(i, 1);
                        
                        while (player.exp >= player.expToNext) {
                            player.level++;
                            player.exp -= player.expToNext;
                            player.expToNext = Math.floor(player.expToNext * 1.5);
                            player.maxHealth += 20;
                            player.health = player.maxHealth;
                            player.attack += 3;
                            player.defense += 2;
                            showLevelUp();
                        }
                        
                        if (monsters.length < 3) {
                            spawnNewMonster();
                        }
                    }
                }
            }
        }
        
        function spawnNewMonster() {
            let types = ['goblin', 'skeleton'];
            let type = types[Math.floor(Math.random() * types.length)];
            let monster = {
                type: type,
                x: Math.random() * 300 + 50,
                y: Math.random() * 300 + 100,
                health: type === 'goblin' ? 50 : 80,
                maxHealth: type === 'goblin' ? 50 : 80,
                attack: type === 'goblin' ? 8 : 12,
                defense: type === 'goblin' ? 2 : 3,
                exp: type === 'goblin' ? 20 : 30,
                gold: type === 'goblin' ? 10 : 15,
                speed: type === 'goblin' ? 1.5 : 1.2,
                size: type === 'goblin' ? 20 : 22,
                frame: 0
            };
            monsters.push(monster);
        }
        
        function showDamage(x, y, damage) {
            let div = document.createElement('div');
            div.className = 'damage';
            div.style.left = x + 'px';
            div.style.top = y + 'px';
            div.textContent = '-' + damage;
            document.getElementById('gameContainer').appendChild(div);
            setTimeout(() => div.remove(), 1000);
        }
        
        function showLevelUp() {
            let div = document.createElement('div');
            div.className = 'level-up';
            div.textContent = 'LEVEL UP!';
            document.getElementById('gameContainer').appendChild(div);
            setTimeout(() => div.remove(), 2000);
        }
        
        // ==================== МАГИЯ ====================
        function castSpell() {
            for (let m of monsters) {
                m.health -= 50;
                showDamage(m.x, m.y, 50);
            }
        }
        
        // ==================== УПРАВЛЕНИЕ ====================
        let keys = {};
        let joystick = document.getElementById('joystick');
        
        joystick.addEventListener('touchstart', (e) => {
            e.preventDefault();
            let touch = e.touches[0];
            let rect = joystick.getBoundingClientRect();
            let x = touch.clientX - rect.left;
            let y = touch.clientY - rect.top;
            
            keys['up'] = y < 30;
            keys['down'] = y > 50;
            keys['left'] = x < 30;
            keys['right'] = x > 50;
        });
        
        joystick.addEventListener('touchend', () => {
            keys = {};
        });
        
        function movePlayer() {
            if (keys['up']) player.y -= player.speed;
            if (keys['down']) player.y += player.speed;
            if (keys['left']) player.x -= player.speed;
            if (keys['right']) player.x += player.speed;
            
            player.x = Math.max(20, Math.min(380, player.x));
            player.y = Math.max(40, Math.min(460, player.y));
        }
        
        // ==================== ИНВЕНТАРЬ ====================
        function useItem(index) {
            if (index === 3 && player.potions > 0) {
                player.health = Math.min(player.maxHealth, player.health + 30);
                player.potions--;
                let slots = document.querySelectorAll('.item-slot');
                slots[3].innerHTML = `🧪 x${player.potions}`;
            } else if (index === 0) {
                player.weapon.equipped = !player.weapon.equipped;
            } else if (index === 1) {
                player.armor.equipped = !player.armor.equipped;
            }
        }
        
        // ==================== ОБНОВЛЕНИЕ UI ====================
        function updateUI() {
            document.getElementById('hp').textContent = Math.floor(player.health);
            document.getElementById('atk').textContent = player.attack + (player.weapon.equipped ? 5 : 0);
            document.getElementById('def').textContent = player.defense + (player.armor.equipped ? 3 : 0);
            document.getElementById('lvl').textContent = player.level;
            document.getElementById('gold').textContent = player.gold;
        }
        
        // ==================== ИГРОВОЙ ЦИКЛ ====================
        function gameLoop() {
            movePlayer();
            
            if (player.attackCooldown > 0) player.attackCooldown--;
            
            // Движение монстров
            for (let m of monsters) {
                if (m.health > 0) {
                    let dx = player.x - m.x;
                    let dy = player.y - m.y;
                    let dist = Math.sqrt(dx*dx + dy*dy);
                    
                    if (dist > 0) {
                        m.x += dx / dist * m.speed;
                        m.y += dy / dist * m.speed;
                    }
                    
                    // Атака монстра
                    if (dist < 25 && player.invincible <= 0) {
                        let damage = m.attack - player.defense - (player.armor.equipped ? 3 : 0);
                        if (damage < 1) damage = 1;
                        player.health -= damage;
                        player.invincible = 30;
                    }
                }
            }
            
            if (player.invincible > 0) player.invincible--;
            
            drawMap();
            drawMonsters();
            drawPlayer();
            updateUI();
            
            requestAnimationFrame(gameLoop);
        }
        
        document.getElementById('attackBtn').addEventListener('click', attack);
        document.getElementById('skillBtn').addEventListener('click', castSpell);
        
        gameLoop();
        
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
    </script>
</body>
</html>
